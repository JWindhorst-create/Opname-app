<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2D6042">
<title>Verbeter- en maatwerkadvies · NTA 8800</title>
<style>
:root{
  --bg:#f3f5f4; --card:#fff; --ink:#1e1e1e; --muted:#6E6E6E; --line:#DCE8E0;
  --brand:#2D6042; --brand2:#2D6042; --accent:#E3F1E7; --gh:#C8E4D0;
  --c1:#1e7b3a; --c2:#4caf50; --c3:#a4c639; --c4:#f2a33a; --c5:#e2522f; --c6:#a3201b; --c8:#2f6db5; --c9:#8a929e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:72px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600;letter-spacing:.2px}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);color:var(--ink);display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brand)}
header.top h1 small{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--muted);font-weight:600;text-transform:uppercase}
header.top button,header.top a.hb{background:var(--gh);color:#1e1e1e;border:0;border-radius:8px;padding:7px 11px;text-decoration:none;font-size:14px}
header.top img{height:44px;width:auto}
main{max-width:860px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{font-size:15px;margin:0 0 6px;color:var(--brand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid .full{grid-column:1/-1}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--brand2);color:#fff;font-weight:600}
.btn.sec{background:var(--accent);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand2);padding:6px 8px}
.btn.danger{background:#fbe9e7;color:#b3261e}
.btn.big{width:100%;padding:14px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand2);font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:7px;color:#fff;font-weight:700;font-size:14px;padding:0 6px}
.cb1{background:var(--c1)}.cb2{background:var(--c2)}.cb3{background:var(--c3)}.cb4{background:var(--c4)}.cb5{background:var(--c5)}.cb6{background:var(--c6)}.cb8{background:var(--c8)}.cb9{background:var(--c9)}.cb0{background:#ccd1d8}
.cond-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cond-pick button{border:2px solid transparent;border-radius:9px;padding:8px 0 6px;color:#fff;font-weight:700;line-height:1.1}
.cond-pick button small{display:block;font-size:9.5px;font-weight:500;opacity:.95}
.cond-pick button.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px 4px;font-size:13.5px}
.seg button.on{background:var(--brand2);color:#fff;font-weight:600}
.group-h{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 2px 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:14px}
.chip.has{border-color:var(--brand2);background:var(--accent);color:var(--brand)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos .ph{position:relative;width:92px;height:92px;border-radius:9px;overflow:hidden;background:#ddd}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.addph{width:92px;height:92px;border:2px dashed var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:#fafbfc}
.mic{border:0;background:var(--accent);color:var(--brand);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:600;float:right;margin-top:-26px}
.mic.rec{background:#e2522f;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 30px}
.sheet .sh-h{position:sticky;top:0;background:var(--brand);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .sh-h b{flex:1}
.sheet .sh-h button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:7px 12px}
.sheet .sh-b{padding:14px}
.suggest{position:relative}
.suggest ul{position:absolute;left:0;right:0;top:100%;z-index:10;list-style:none;margin:2px 0 0;padding:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:260px;overflow:auto}
.suggest li{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.suggest li:hover{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.att-row{padding:10px 0;border-bottom:1px solid var(--line)}
.att-row:last-child{border:0}
.att-row .seg button{font-size:12.5px;padding:8px 2px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi div{background:var(--accent);border-radius:11px;padding:10px 12px}
.kpi b{display:block;font-size:19px;color:var(--brand)}
.kpi span{font-size:12px;color:var(--muted)}
.preview-wrap{background:#c9ced6;border-radius:12px;padding:12px;overflow:auto;max-height:70vh}
.preview-wrap .rpt{transform-origin:top left}

/* ============ RAPPORT (huisstijl briefpapier dashboard) ============ */
.rpt{--g:#2D6042;--gh:#C8E4D0;--g1:#E3F1E7;--g0:#F6FAF7;--ln:#DCE8E0;--mu:#6E6E6E;font:9.3pt/1.5 "Segoe UI",Arial,Helvetica,sans-serif;color:#1e1e1e;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rpt .pg{width:210mm;height:296.8mm;position:relative;overflow:hidden;background:#fff;margin:0 0 10px}
.rpt .bp-wm{position:absolute;left:0;bottom:0;width:210mm;z-index:0}
.rpt .bp-logo{position:absolute;top:15.9mm;right:12mm;width:24.8mm;z-index:1}
.rpt .ph{position:absolute;top:19mm;left:16mm;right:48mm;z-index:1}
.rpt .ph .t1{font-size:7.3pt;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu)}
.rpt .ph .t2{font-size:14pt;font-weight:700;color:var(--g);margin-top:.6mm;line-height:1.2}
.rpt .ph .t3{font-size:8.3pt;color:var(--mu);margin-top:.6mm}
.rpt .pc{position:absolute;top:50mm;left:16mm;right:16mm;z-index:1}
.rpt .pf{position:absolute;bottom:9mm;left:16mm;right:16mm;display:flex;justify-content:space-between;font-size:7.5pt;color:var(--mu);border-top:.4pt solid var(--ln);padding-top:2mm;z-index:1}
.rpt .wmk{position:absolute;top:44%;left:0;right:0;text-align:center;font-size:84pt;font-weight:800;letter-spacing:10px;color:rgba(45,96,66,.06);transform:rotate(-30deg);z-index:2;pointer-events:none}
.rpt .blk{display:flow-root;margin-bottom:4mm}
.rpt .ico{display:inline-flex;align-items:center;justify-content:center;background:var(--gh);color:var(--g);border-radius:2mm;flex:none}
.rpt .ico svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rpt h2{display:flex;align-items:center;gap:3.5mm;font-size:15pt;font-weight:700;color:var(--g);margin:0;padding-bottom:2.5mm;border-bottom:.8pt solid var(--g)}
.rpt h2 .no{font-size:9pt;color:var(--mu);font-weight:600;letter-spacing:1px}
.rpt h3{display:flex;align-items:center;gap:2.5mm;font-size:10.5pt;color:var(--g);margin:0 0 2.5mm;font-weight:700}
.rpt p{margin:0 0 2mm}
.rpt .note{font-size:8pt;color:var(--mu)}
.rpt table{width:100%;border-collapse:collapse;font-size:8.8pt;background:rgba(255,255,255,.85)}
.rpt th{background:var(--gh);color:#1e1e1e;text-align:left;padding:2mm 2.5mm;font-weight:700;font-size:8.3pt}
.rpt td{padding:2mm 2.5mm;border-bottom:.4pt solid var(--ln);vertical-align:top}
.rpt tr.tot td{font-weight:700;background:var(--g1);border-bottom:0}
.rpt .r{text-align:right;white-space:nowrap}
.rpt .dl{display:grid;grid-template-columns:1fr 1fr;gap:0 9mm}
.rpt .dl div{display:grid;grid-template-columns:38mm 1fr;gap:3mm;padding:1.7mm 0;border-bottom:.4pt solid var(--ln)}
.rpt .dl span{color:var(--mu)}
.rpt .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.rpt .kpis>div{background:var(--g0);border:.4pt solid var(--ln);border-radius:1.6mm;padding:2.8mm 3.2mm}
.rpt .kpis span{display:block;font-size:7.4pt;color:var(--mu)}
.rpt .kpis b{font-size:13.5pt;font-weight:700;color:#1e1e1e}
.rpt .kpis .hl{background:var(--g);border-color:var(--g)}.rpt .kpis .hl span{color:rgba(255,255,255,.8)}.rpt .kpis .hl b{color:#fff}
.rpt .profile{display:flex;height:6mm;border-radius:1mm;overflow:hidden;background:var(--g0)}
.rpt .profile div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:7.5pt;font-weight:700}
.rpt .pleg{display:flex;flex-wrap:wrap;gap:1.5mm 5mm;margin-top:2mm;font-size:7.8pt;color:var(--mu)}
.rpt .pleg i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.6mm;margin-right:1.3mm;vertical-align:-.3mm}
.rpt .bar{height:2.2mm;background:var(--g);border-radius:.6mm}
.rpt .dots{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm}
.rpt .dots div{display:flex;align-items:center;gap:2.5mm;padding:1.6mm 0;border-bottom:.4pt solid var(--ln);font-size:8.6pt}
.rpt .dots div em{margin-left:auto;font-style:normal;color:var(--mu);font-size:7.8pt;text-align:right}
.rpt .dot{width:2.8mm;height:2.8mm;border-radius:50%;flex:none}
.rpt .d-ok{background:#2e8b4a}.rpt .d-let{background:#e9a23b}.rpt .d-no{background:#c8372d}.rpt .d-nt{background:#2f6db5}.rpt .d-nc{background:#c3c8d0}
.rpt .concl{background:var(--g0);border:.4pt solid var(--ln);border-left:1.4mm solid var(--g);padding:3.5mm 4.5mm;border-radius:0 1.6mm 1.6mm 0}
.rpt .concl h4{margin:0 0 1mm;font-size:9pt;color:var(--g)}
.rpt .badge{height:5.2mm;min-width:5.2mm;font-size:8pt;border-radius:1mm;padding:0 1.2mm}
.rpt .pill{display:inline-flex;align-items:center;border-radius:1mm;color:#fff;font-weight:600;font-size:8pt;padding:.7mm 2.3mm;white-space:nowrap}
.rpt .scale{display:grid;grid-template-columns:repeat(6,1fr);gap:1mm}
.rpt .scale div{color:#fff;padding:2.5mm 2mm;font-size:7.8pt;line-height:1.25}
.rpt .scale div b{display:block;font-size:13pt}
.rpt .scale div:first-child{border-radius:1mm 0 0 1mm}.rpt .scale div:last-child{border-radius:0 1mm 1mm 0}
.rpt .bv{background:#fff;border:.4pt solid var(--ln);border-left:1.4mm solid #c3c8d0;border-radius:0 1.6mm 1.6mm 0}
.rpt .bv .bh{display:flex;justify-content:space-between;align-items:center;gap:4mm;padding:2.6mm 4mm;background:var(--g0);border-bottom:.4pt solid var(--ln);border-radius:0 1.6mm 0 0}
.rpt .bv .bh .ref{font-size:7.3pt;color:var(--mu)}
.rpt .bv .bh b{font-size:10pt}
.rpt .bv .bb{display:grid;grid-template-columns:1fr 46mm;gap:5mm;padding:3mm 4mm}
.rpt .bv .txt div{margin-bottom:1.8mm}.rpt .bv .txt span{display:block;font-size:7.4pt;color:var(--g);font-weight:700}
.rpt .bv .cost{background:var(--g1);border-radius:1.2mm;padding:2.4mm 3mm;font-size:8.3pt;align-self:start}
.rpt .bv .cost div{display:flex;justify-content:space-between;gap:2mm;padding:.5mm 0}
.rpt .bv .cost .nhg{margin-top:1mm;font-size:7.3pt;font-weight:700;color:var(--g)}
.rpt .bv .bp{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm;padding:0 4mm 3.5mm}
.rpt .bv .bp figure{margin:0}.rpt .bv .bp img{width:100%;height:36mm;object-fit:cover;border-radius:1mm;display:block}
.rpt .bv .bp figcaption{font-size:6.8pt;color:var(--mu);margin-top:.7mm}
.rpt .toc a{display:flex;gap:4mm;align-items:center;padding:2.6mm 0;border-bottom:.4pt solid var(--ln);font-size:11pt;color:#1e1e1e;text-decoration:none}
.rpt .toc .no{font-weight:700;color:var(--mu);font-size:8.5pt;width:8mm}
.rpt .toc .pn{margin-left:auto;color:var(--mu);font-size:9.5pt}
.rpt .sign{display:grid;grid-template-columns:1fr 1fr;gap:12mm}
.rpt .sign .sigbox{height:20mm;display:flex;align-items:flex-end}
.rpt .sign .sigbox img{max-height:20mm;max-width:60mm}
.rpt .sign .sl{border-top:.6pt solid #1e1e1e;padding-top:2mm;font-size:8.6pt}
.rpt .status{display:inline-block;padding:.4mm 2mm;border-radius:1mm;font-size:7.5pt;font-weight:700;letter-spacing:.5px}
.rpt .status.concept{background:#fff1dc;color:#9a5a00}.rpt .status.def{background:var(--gh);color:var(--g)}
/* voorblad */
.rpt .cover .bp-logo{top:14mm;right:14mm;width:38mm}
.rpt .cv-head{position:absolute;top:22mm;left:16mm;right:62mm;z-index:1}
.rpt .cv-head .kick{font-size:8pt;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--mu)}
.rpt .cv-head h1{font-size:26pt;line-height:1.1;margin:4mm 0 2mm;color:var(--g);font-weight:700}
.rpt .cv-head .sub{font-size:11.5pt;color:#1e1e1e}
.rpt .cv-head .doel{display:inline-block;margin-top:4mm;background:var(--gh);color:var(--g);font-weight:700;font-size:9pt;padding:1.2mm 3.5mm;border-radius:1.2mm}
.rpt .cv-photo{position:absolute;top:76mm;left:16mm;right:16mm;height:92mm;border-radius:2mm;background:var(--g0) center/cover no-repeat;border:.4pt solid var(--ln);display:flex;align-items:center;justify-content:center;color:var(--g);z-index:1}
.rpt .cv-kpi{position:absolute;top:176mm;left:16mm;right:16mm;display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;z-index:1}
.rpt .cv-kpi>div{display:flex;gap:3mm;align-items:center;background:rgba(255,255,255,.92);border:.4pt solid var(--ln);border-radius:1.6mm;padding:3mm}
.rpt .cv-kpi span{display:block;font-size:7.4pt;color:var(--mu)}
.rpt .cv-kpi b{font-size:14pt}
.rpt .cv-meta{position:absolute;top:202mm;left:16mm;right:16mm;display:grid;grid-template-columns:repeat(3,1fr);gap:3mm 6mm;font-size:8.8pt;background:rgba(255,255,255,.92);padding:4mm 0;border-top:.8pt solid var(--g);z-index:1}
.rpt .cv-meta span{display:block;font-size:7.2pt;color:var(--mu)}
.rpt .cv-meta .status{display:inline-block;font-size:7.5pt}
.rpt .cv-co{position:absolute;bottom:12mm;left:16mm;right:16mm;font-size:8pt;color:#1e1e1e;z-index:1}
.rpt .cv-co b{color:var(--g)}

#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .rpt .pg{margin:0;break-after:page;page-break-after:always}
  .rpt .pg:last-child{break-after:auto;page-break-after:auto}
}
#hCamV{position:fixed;inset:0;z-index:6000;background:#000;display:flex;flex-direction:column}#hCamV[hidden]{display:none}#hCamV video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.hc-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;font-weight:600;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.hc-top button{background:rgba(0,0,0,.4);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 12px}
.hc-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#111;min-height:78px}.hc-th{position:relative;flex:0 0 auto}.hc-th img{width:62px;height:62px;object-fit:cover;border-radius:8px;display:block}
.hc-th button{position:absolute;top:3px;right:3px;border:0;border-radius:99px;padding:1px 7px;font-size:13px;background:rgba(255,255,255,.92);color:#b3261e}
.hc-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:#111;color:#fff}.hc-bar span{width:90px;font-size:14px}
#hcKlik{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #9aa8a0;padding:0;flex:0 0 auto;box-shadow:0 0 0 3px #fff inset}#hcKlik:active{transform:scale(.93)}
#hcKlaar{width:90px;flex:0 0 auto;background:#2D6042;color:#fff;border:0;border-radius:8px;padding:9px 0;font-weight:700}
.hc-flits{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.hc-flits.aan{animation:hcf .25s ease-out}@keyframes hcf{from{opacity:.75}to{opacity:0}}
.ui-ic{display:inline-block;vertical-align:-0.2em;flex:0 0 auto}.addph .ui-ic{margin-bottom:3px}.hb .ui-ic,#btnSettings .ui-ic{vertical-align:middle}.mic .ui-ic{vertical-align:-0.15em}.ui-n{display:inline-flex;align-items:center;gap:3px}

.att-row{display:grid;gap:8px}
.att-row b{display:block}
.seg.att-seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);margin:0}
.seg.att-seg button{grid-column:span 2;display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:6px 8px;line-height:1.2;font-size:13px;border:0;background:#fff;hyphens:none;overflow-wrap:normal}
.seg.att-seg button:nth-child(n+4){grid-column:span 3}
.seg.att-seg button.on{background:var(--brand2);color:#fff;font-weight:600}
@media (min-width:640px){.seg.att-seg{grid-template-columns:repeat(5,minmax(0,1fr))}.seg.att-seg button,.seg.att-seg button:nth-child(n+4){grid-column:auto}}
.att-row input{width:100%;margin:0}
.att-open{margin:4px 0 0;font-size:13px;font-weight:600;color:#b45309}
.att-open.klaar{color:var(--brand2)}
.d-leeg{background:#fff!important;border:1.5px solid #9aa3ad}

.el-groups{display:grid;gap:8px;margin-top:6px}
.el-grp{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.el-grp summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;font-weight:700;color:var(--brand)}
.el-grp summary::-webkit-details-marker{display:none}

 /* hulpenergie, verlichting (utiliteit), PV */
 const sc=s.fn==='woning'?1:Ag/100;
 const aux=(isWP(s.opw)?200:s.opw==='hybride'?150:s.opw==='elek'?20:80)*sc+({A:0,C:s.dc?100:250,Cco2:80,D:s.dc===false?400:220}[s.vent]??150)*sc;
 el+=aux;let verl=0;if(s.fn!=='woning'){verl=nzd(s.verl)*Ag*2200/1000*.9;el+=verl}
 const pv=nzd(s.pv)*875*(PVF[s.pvOr]||.9);
 const fpN=P.fpNet??1.0,fpE=1.45;
 const prim=gas+net*fpN+el*fpE-pv*fpE;
 const ep2=prim/Ag,ren=amb+pv+zon,fos=gas+net*fpN+el*fpE,ep3=ren/Math.max(1,ren+fos)*100;
 const gasM3=gas/9.769,elNet=el-pv;
 return{Ag,HT,HV,H,Qh,Qw:Qw0,T,cop,hyb,gas,el,net,pv,aux,verl,ep2,ep1:(Qh+Qw0)/Ag,ep3,gasM3,elNet,amb,zon,mnd,tau,etaDis,Agl,Aop}}

/* energiekosten en CO2 per jaar */
function kosten(r,P){const pg=nzd(P.pgas)||1.35,pe=nzd(P.pstroom)||.30,pt=nzd(P.pterug)??.05,pw=nzd(P.pwarmte)||.11;
 let ce;if(P.saldering){ce=r.elNet>=0?r.elNet*pe:r.elNet*pt}else{const direct=Math.min(r.el,r.pv*.35);ce=(r.el-direct)*pe-(r.pv-direct)*pt}
 const tot=r.gasM3*pg+ce+r.net*pw;const co2=r.gasM3*1.78+r.elNet*(nzd(P.co2el)||.33)+r.net*.15;return{tot,gas:r.gasM3*pg,el:ce,co2}}

/* kalibratie: EP2(k) = a + b·k ; k zodanig dat het model het EP2 van het label haalt */
function kalibreer(s,ep2Act,P){const r1=reken(s,1,P),r2=reken(s,2,P);const b=r2.ep2-r1.ep2,a=r1.ep2-b;
 if(!(ep2Act>0)||!(b>0))return{k:1,ep2Model:r1.ep2,ok:false};let k=(ep2Act-a)/b;const raw=k;k=Math.max(.35,Math.min(2.5,k));return{k,raw,ep2Model:r1.ep2,ok:Math.abs(raw-k)<1e-9}}

/* forfaitaire Rc naar bouwjaar (ISSO 82.1/75.1 tabel 8.9 en 8.10) */
function rcForf(el,jaar,spouw,geisoleerd){jaar=+jaar||0;const g=el==='gevel'?'gevel':el==='vloer'?'vloer':'dak';
 if(jaar<1965)return RC_T89[g][spouw?'spouw':'geen'][geisoleerd?1:0];
 const T=RC_T810[g];for(const [k,v] of T){const m=k.match(/(\d{4})\D+(\d{4})/);if(m&&jaar>=+m[1]&&jaar<+m[2])return v;if(/vanaf/.test(k)&&jaar>=+k.match(/\d{4}/)[0])return v}return T[T.length-1][1]}

const BCRG_SOORT={

 buiten:{l:'Buitengevelisolatie',el:'gevel',ok:(t,ty)=>(/etics|buitengevel|pavawall|steenstrip|gevelisolatie/i.test(t)||/buitenzijde|ononderbroken/i.test(ty))&&!/spouwmuur|voorzet|hsb|spouwanker|parel|pearl|schuim|foam/i.test(t+' '+ty)},
 dakbinnen:{l:'Hellend dak binnenzijde',el:'dak',ok:(t,ty)=>/binnenzijde|tussen.*(gording|spoor)|onderzijde hellend|hellend|dakbeschot|onder dakpannen|hout/i.test(ty)&&!/buitenzijde|plat|riet/i.test(ty)},
 dakplat:{l:'Plat dak (op de dakvloer)',el:'dak',ok:(t,ty)=>/buitenzijde|plat|balast|ononderbroken|mechanisch bevestigd/i.test(ty)&&!/binnenzijde|tussen|gording|hellend|dakbeschot|riet|spouw/i.test(ty)},
 vloer:{l:'Vloerisolatie onderzijde',el:'vloer',ok:(t,ty)=>!/zolder|berging|bovenzijde|schuimbeton|op zand|systeemvloer|beton$|bodem/i.test(t+' '+ty)},
 bodem:{l:'Bodemisolatie kruipruimte',el:'bodem',ok:(t,ty)=>/bodem|kruipruimte/i.test(t+' '+ty)}};
function bcrgEl(toep,ty){const t=String(ty).toLowerCase();
 if(/bodem|kruip/.test(t))return'bodem';if(/vloer|zolder/.test(t))return'vloer';if(/dak/.test(t))return'dak';if(/gevel|wand|spouw/.test(t))return'gevel';
 return{G:'gevel',D:'dak',V:'vloer',B:'bodem'}[toep]||''}
/* alle BCRG-verklaringen (basisopname) die bij een maatregel passen */
function bcrgKandidaten(soort){const B=BCRG_SOORT[soort];if(!B||typeof RC_BCRG==='undefined')return[];const out=[];
 RC_BCRG.forEach(x=>{const [nr,tit,fab,toep,basis,types,pdf]=x;if(!basis)return;
  types.forEach(([ty,rows])=>{const el=bcrgEl(toep,ty);if(el!==B.el&&!(soort==='bodem'&&/bodem/i.test(tit)&&el==='vloer'))return;if(!B.ok(tit,ty))return;
   if(/^dikte/i.test(ty))return;const R=rows.filter(r=>typeof r[0]==='number'&&r[0]>=10&&typeof r[1]==='number'&&r[1]>0&&r[1]<15);if(R.length)out.push({nr,tit,fab,ty,rows:R,pdf})})});return out}
/* kies product + dikte: minimale dikte die de doel-Rc haalt (binnen max. dikte), anders hoogste Rc */
function bcrgKies(soort,doelRc,maxD,minD){const L=bcrgKandidaten(soort);let best=null;
 L.forEach(p=>p.rows.forEach(([d,rc])=>{if(maxD&&d>maxD)return;if(minD&&d<minD)return;const c={...p,d,rc};
  if(!best)best=c;else{const okA=best.rc>=doelRc,okB=rc>=doelRc;if(okB&&!okA)best=c;else if(okB&&okA){if(d<best.d||(d===best.d&&rc>best.rc))best=c}else if(!okB&&!okA&&rc>best.rc)best=c}}));return best}
function bcrgOpties(soort,doelRc,maxD,minD,n=8){const L=bcrgKandidaten(soort),out=[];
 L.forEach(p=>{let b=null;p.rows.forEach(([d,rc])=>{if(maxD&&d>maxD)return;if(minD&&d<minD)return;if(!b||(b.rc<doelRc&&rc>b.rc)||(rc>=doelRc&&b.rc>=doelRc&&d<b.d))b={...p,d,rc}});if(b)out.push(b)});
 return out.sort((a,b)=>(b.rc>=doelRc)-(a.rc>=doelRc)||(a.rc>=doelRc?a.d-b.d:b.rc-a.rc)).slice(0,n)}

const bcrgKey=p=>p?p.nr+'|'+p.ty+'|'+p.d:'';

const M=Object.fromEntries(MAATR.map(m=>[m.k,m]));
const fx=(v,d=2)=>isFinite(+v)?(+v).toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';

/* ---------- pakket toepassen ---------- */
function pasToe(base,lijst,A){const s=clone(base);s._dGO=0;const regels=[];
 for(const o of lijst){const m=M[o.k];if(!m)continue;
  if(m.prod&&!o.bcrg){const p=m.prod(s,o);if(p)o.bcrg=bcrgKey(p)}
  const s0=clone(s),kost=m.kost(s0,o,A),hv=m.hv(s0,o),prod=m.prod?m.prod(s0,o):null,mat=m.mat(s0,o,A);
  const ag0=s.Ag;m.doe(s,o,A);const dGO=ag0-s.Ag;s._dGO=(s._dGO||0)+dGO;const vabi=m.vabi?m.vabi(Object.assign(s0,{_dGO:dGO}),o):[];
  regels.push({k:m.k,o,kost:o.kostVast!=null&&o.kostVast!==''?nzd(o.kostVast):kost,hv,prod,mat,vabi,dGO})}
 return{s,regels}}

// voorkeursmaatregel per groep bij "force"
function beste(s,grp,A,ex){const L=MAATR.filter(m=>m.grp===grp&&!ex.includes(m.k)&&m.ok(s));if(!L.length)return null;
 if(grp==='gevel'){const pref=(A.doel&&A.doel.gevelVoorkeur)||'voorzet';return L.find(m=>m.k==='spouw')||L.find(m=>m.k===pref)||L[0]}
 if(grp==='glas'){const pref=(A.doel&&A.doel.glasVoorkeur)||'hrpp';return L.find(m=>m.k===pref)||L[0]}
 if(grp==='vloer')return L.find(m=>m.k==='vloer')||L[0];
 if(grp==='opw')return L.find(m=>m.k==='wplw')||L[0];
 return L[0]}
function bouwPakket(base,route,doelLabel,A,P,k){const ex=(A.doel&&A.doel.uitsluiten)||[];const lijst=[];let s=clone(base);const used=new Set();
 const add=m=>{const o={k:m.k};if(m.k==='pv'){o.kWp=pvMax(s).kWp}lijst.push(o);used.add(m.grp);const r=pasToe(s,[o],A);s=r.s};
 const grens=grensVoor(doelLabel,base.fn);
 for(const g of route.force||[]){if(used.has(g))continue;if(M[g]&&!ex.includes(g)){if(M[g].ok(s))add(M[g]);continue}const m=beste(s,g,A,ex);if(m)add(m)}
 // all-electric: LT-afgifte als de woning niet op ≤ 55 °C kan
 if(route.k==='allelec'&&!ex.includes('lt')){const r=reken(s,k,P);if(r.T>55&&M.lt.ok(s))add(M.lt)}
 // aanvullen tot doel (greedy, meeste EP2-winst per euro)
 let guard=0;while(reken(s,k,P).ep2>grens+1e-6&&guard++<20){const r0=reken(s,k,P).ep2;let best=null;
  for(const m of MAATR){if(ex.includes(m.k)||used.has(m.grp)||!m.ok(s))continue;if(route.alleen&&!route.alleen.includes(m.cat))continue;
   if(route.na==='inst'&&m.cat==='schil'&&(route.force||[]).includes(m.grp))continue;
   const o={k:m.k};if(m.k==='pv')o.kWp=pvMax(s).kWp;const t=pasToe(s,[o],A);const d=r0-reken(t.s,k,P).ep2;if(d<=.3)continue;const c=Math.max(50,t.regels[0].kost);const sc=d/c;if(!best||sc>best.sc)best={m,o,sc}}
  if(!best)break;lijst.push(best.o);used.add(best.m.grp);s=pasToe(s,[best.o],A).s}
 return lijst}
function resultaat(base,lijst,A,P,k){const t=pasToe(base,lijst,A),r=reken(t.s,k,P),c=kosten(r,P);const inv=t.regels.reduce((a,x)=>a+x.kost,0);
 return{s:t.s,regels:t.regels,r,c,inv,label:labelVan(r.ep2,base.fn)}}

/* ---------- spraak ---------- */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
function addMic(ta){
  if(!SR||ta._mic) return; ta._mic=1;
  const b=document.createElement('button'); b.type='button'; b.className='mic'; b.innerHTML=MIC_IC+' Inspreken';
  ta.parentNode.insertBefore(b,ta);
  let r=null;
  b.onclick=()=>{
    if(r){ r.stop(); return; }
    r=new SR(); r.lang='nl-NL'; r.continuous=true; r.interimResults=false;
    r.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal){ let t=e.results[i][0].transcript.trim(); t=t.charAt(0).toUpperCase()+t.slice(1); ta.value=(ta.value?ta.value.replace(/\s*$/,'')+(/[.!?]$/.test(ta.value.trim())?' ':'. '):'')+t; ta.dispatchEvent(new Event('input')); } } };
    r.onend=()=>{ r=null; b.classList.remove('rec'); b.innerHTML=MIC_IC+' Inspreken'; };
    r.onerror=()=>{ toast('Spraak niet beschikbaar'); };
    try{ r.start(); b.classList.add('rec'); b.innerHTML=STOP_IC+' Stop'; }catch(_){ r=null; }

/* ---------- gevel- en dakvlakken uit de 3D BAG (LoD 2.2) ---------- */
const KOMPAS=['N','NO','O','ZO','Z','ZW','W','NW'];
const kompasVan=az=>KOMPAS[Math.round(((az%360)+360)%360/45)%8];
const ROLLEN=[['','– kies –'],['voor','Voorgevel'],['achter','Achtergevel'],['zijL','Zijgevel links'],['zijR','Zijgevel rechts'],['zij','Zijgevel'],['scheidend','Woningscheidend']];
const rolLbl=r=>(ROLLEN.find(x=>x[0]===r)||['',''])[1];
function newell(p){ let x=0,y=0,z=0; for(let i=0;i<p.length;i++){ const a=p[i],b=p[(i+1)%p.length]; x+=(a[1]-b[1])*(a[2]+b[2]); y+=(a[2]-b[2])*(a[0]+b[0]); z+=(a[0]-b[0])*(a[1]+b[1]); } const l=Math.hypot(x,y,z)||1; return {n:[x/l,y/l,z/l],a:l/2}; }
function vlakkenUit3D(j,at){
  const f=j.feature||j, V=f.vertices; if(!V||!f.CityObjects) return null;
  const tr=j.metadata?.transform||f.transform||j.transform, sc=tr?.scale||[1,1,1], tl=tr?.translate||[0,0,0];
  const P=i=>{ const v=V[i]; return [v[0]*sc[0]+tl[0],v[1]*sc[1]+tl[1],v[2]*sc[2]+tl[2]]; };
  const W=[],R=[];
  for(const k in f.CityObjects){ const gs=f.CityObjects[k].geometry||[]; const g=['2.2','2.1','2','1.3','1.2'].map(l=>gs.find(x=>String(x.lod)===l)).find(Boolean); if(!g) continue;
    const sem=g.semantics; let shells,vals;
    if(g.type==='Solid'){ shells=g.boundaries; vals=sem?.values; } else if(g.type==='MultiSolid'||g.type==='CompositeSolid'){ shells=g.boundaries.flat(1); vals=sem?.values?.flat(1); } else { shells=[g.boundaries]; vals=sem?[sem.values]:null; }
    shells.forEach((sh,si)=>sh.forEach((srf,fi)=>{ const ring=srf[0]; if(!ring||ring.length<3) return; const v=vals?.[si]?.[fi]; const ty=v!=null?(sem.surfaces[v]?.type||''):'';
      const pts=ring.map(P), {n,a}=newell(pts); if(a<0.3) return; const az=(Math.atan2(n[0],n[1])*180/Math.PI+360)%360;
      if(/Ground/i.test(ty)||n[2]<-0.8) return;
      if(/Wall/i.test(ty)||(!ty&&Math.abs(n[2])<0.2)) W.push({az,a}); else if(/Roof/i.test(ty)||n[2]>0.2) R.push({az,a,h:Math.acos(Math.min(1,Math.abs(n[2])))*180/Math.PI}); })); }
  if(!W.length) return null;
  // hoofdrichting van het pand (gewogen gemiddelde van de wandrichtingen modulo 90°)
  let s4=0,c4=0; W.forEach(w=>{ const t=w.az*Math.PI/180*4; s4+=w.a*Math.sin(t); c4+=w.a*Math.cos(t); }); const th=((Math.atan2(s4,c4)*180/Math.PI/4)+360)%90;
  const kant=az=>((Math.round(((az-th)%360+360)%360/90))%4);
  const G=[0,1,2,3].map(i=>({id:'g'+i,az:(th+90*i)%360,m2:0}));
  W.forEach(w=>{ G[kant(w.az)].m2+=w.a; });
  let gevels=G.filter(g=>g.m2>=1).map(g=>({...g,m2:Math.round(g.m2),kompas:kompasVan(g.az),rol:'',glas:25}));
  // woningscheidende wanden afleiden uit 3D BAG (opp. scheidingsmuur)
  const sch=+(at&&at.b3_opp_scheidingsmuur)||0;
  if(sch>5&&gevels.length>=3){ const opties=[]; gevels.forEach((a,i)=>{ opties.push([i]); gevels.forEach((b,k)=>{ if(k>i&&Math.abs(Math.abs(((a.az-b.az+540)%360)-180)-180)<10) opties.push([i,k]); }); });
    let best=null,bd=1e9; opties.forEach(o=>{ const d=Math.abs(o.reduce((x,i)=>x+gevels[i].m2,0)-sch); if(d<bd){ bd=d; best=o; } });
    if(best&&bd<Math.max(8,sch*0.35)) best.forEach(i=>{ gevels[i].rol='scheidend'; gevels[i].glas=0; }); }
  // daken: plat samen, hellend per kant
  const plat=R.filter(r=>r.h<10).reduce((x,r)=>x+r.a,0);
  const DH=[0,1,2,3].map(i=>({id:'d'+i,az:(th+90*i)%360,m2:0,hs:0}));
  R.filter(r=>r.h>=10).forEach(r=>{ const d=DH[kant(r.az)]; d.m2+=r.a; d.hs+=r.h*r.a; });
  const daken=[...(plat>=1?[{id:'dp',plat:1,m2:Math.round(plat),kompas:'plat',helling:0}]:[]),...DH.filter(d=>d.m2>=1).map(d=>({id:d.id,az:d.az,m2:Math.round(d.m2),kompas:kompasVan(d.az),helling:Math.round(d.hs/d.m2)}))];
  return {gevels,daken,auto:1};
}

const mmPx=mm=>mm*96/25.4;
async function renderPages(){ await prepS2Logo();
 const a=S.cur,o=a.obj,st=S.settings;const secs=buildSections();
 try{if(document.fonts)await document.fonts.ready}catch(_){}
 const meas=document.createElement('div');meas.className='rpt';meas.style.cssText='position:absolute;left:-10000px;top:0;visibility:hidden;width:178mm';document.body.appendChild(meas);
 const AREA=mmPx(227);const pages=[],startOf={};
 for(const s of secs){if(s.cover){pages.push({cover:true,html:s.html});continue}
  let cur={sec:s,blocks:[]},used=0;pages.push(cur);startOf[s.no||'IN']=pages.length;
  for(const b of s.blocks){meas.innerHTML=`<div class="blk">${b}</div>`;const imgs=[...meas.querySelectorAll('img')];await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
   const h=meas.firstChild.getBoundingClientRect().height+mmPx(4);if(used+h>AREA&&cur.blocks.length){cur={sec:s,blocks:[],cont:true};pages.push(cur);used=0}cur.blocks.push(b);used+=h}}
 meas.remove();
 const N=pages.length,concept=(a.status||'concept')==='concept';const wm=bpWm(),logo=bpLogo(),adres=[o.adres,o.plaats].filter(Boolean).join(', ');const sd=SOORT[o.soort]||SOORT.verbeter;
 const base=`${wm?`<img class="bp-wm" src="${wm}">`:''}<img class="bp-logo" src="${logo}">${concept?'<div class="wmk">CONCEPT</div>':''}`;
 return pages.map((p,i)=>{if(p.cover)return`<div class="pg cover s2">${p.html}</div>`;
  const html=p.blocks.map(b=>`<div class="blk">${b}</div>`).join('').replace(/\{\{p:(\w+)\}\}/g,(_,x)=>startOf[x]||'');
  return`<div class="pg">${base}<div class="ph"><div class="t1">${esc(st.bedrijf?st.bedrijf+' · ':'')}${esc(sd.kick)}</div><div class="t2">${esc(adres||'')}</div><div class="t3">${p.sec.no?esc(p.sec.no)+' · ':''}${esc(p.sec.title)}${p.cont?' (vervolg)':''}</div></div>
   <div class="pc">${html}</div><div class="pf"><span>Rapport ${esc(a.rapportnr)} · versie ${esc(a.versie||'1.0')} · ${fmtDate(o.rapportdatum||o.datum)}</span><span>Pagina ${i+1} van ${N}</span></div></div>`}).join('')}

 s.gevels=(h.gevels||[]).map(g=>({...g,m2:num(g.m2),glas:num(g.glas),Rc:num(g.Rc)}));s.daken=(h.daken||[]).map(d=>({...d,m2:num(d.m2),Rc:num(d.Rc),ramen:num(d.ramen)}));
 s.vloer={...h.vloer,m2:num(h.vloer&&h.vloer.m2),Rc:num(h.vloer&&h.vloer.Rc)};return s}

function kal(a=S.cur){const s=basis(a),P=PP(a);return kalibreer(s,num(a.obj.ep2Label),P)}
function huidig(a=S.cur){const s=basis(a),P=PP(a),c=kal(a),r=reken(s,c.k,P);return{s,P,c,r,kc:kosten(r,P),label:num(a.obj.ep2Label)>0?labelVan(num(a.obj.ep2Label),s.fn):labelVan(r.ep2,s.fn)}}
function pakRes(p,a=S.cur){const H=huidig(a);const R=resultaat(H.s,p.lijst,a,H.P,H.c.k);const vabi=num(p.ep2Vabi);if(vabi||p.ep2Vabi==='0'){R.ep2Vabi=vabi;R.label=labelVan(vabi,H.s.fn)}
 R.ep2=vabi||p.ep2Vabi==='0'?vabi:R.r.ep2;R.bespaar=H.kc.tot-R.c.tot;R.tvt=R.bespaar>0?R.inv/R.bespaar:null;R.co2red=H.kc.co2-R.c.co2;R.stap=stappen(H.label,R.label);
 const mw=verbruikFactor(a,H);R.gasWerk=mw?R.r.gasM3*mw.g:null;return R}

 $('#view').innerHTML=`
 <div class="card"><h2>Doel</h2><p class="muted" style="margin-top:0">Huidig: ${lblBadge(H.label)} EP2 ${fx(num(a.obj.ep2Label)||H.r.ep2,1)} kWh/m². Kies één of meer doellabels; de pakketten worden over de doelen verdeeld.</p>
  <label>Doellabel(s)</label><div class="cl-chips" id="dl">${DOEL_LBL.map(l=>`<button data-l="${l}" class="${d.labels.includes(l)?'on':''}">${l}</button>`).join('')}</div>
  <label>Routes / pakketten</label><div class="rt-list">${ROUTES.map(r=>`<label class="rt"><input type="checkbox" data-route="${r.k}" ${d.routes.includes(r.k)?'checked':''}><span><b>${esc(r.n)}</b><small>${esc(r.d)}</small></span></label>`).join('')}</div>
  <div class="grid">${SEL('doel.gevelVoorkeur','Voorkeur gevelisolatie (als de spouw niet kan)',[['voorzet','Voorzetwand binnenzijde'],['buiten','Buitengevelisolatie']])}${SEL('doel.glasVoorkeur','Voorkeur glas',[['hrpp','HR++ in bestaande kozijnen'],['triple','Triple glas met nieuwe kozijnen']])}</div>
  <label>Maatregelen uitsluiten</label><div class="cl-chips" id="ex">${MAATR.map(m=>`<button data-x="${m.k}" class="${d.uitsluiten.includes(m.k)?'on':''}" title="${esc(m.eis)}">${esc(m.n)}${ok.includes(m)?'':' ·n.v.t.'}</button>`).join('')}</div>
  <button class="btn big" id="bouw" style="margin-top:14px">${a.pakketten.length?'Pakketten opnieuw samenstellen':'Pakketten samenstellen'}</button>
  <p class="muted" style="margin:6px 0 0">Per route wordt eerst de kern van de route toegepast en daarna aangevuld met de maatregel die de meeste EP2-winst per euro geeft, tot het doellabel is bereikt.</p></div>
 <div class="card"><h2>Energieprijzen en uitgangspunten</h2><div class="grid">
  ${F('P.pgas','Gasprijs (€/m³ incl. btw)','number')}${F('P.pstroom','Stroomprijs (€/kWh incl. btw)','number')}
  ${F('P.pterug','Terugleververgoeding (€/kWh)','number')}${CHK('P.saldering','Salderen (vervalt per 2027)')}
  ${F('P.co2el','CO₂ elektriciteit (kg/kWh)','number')}${F('P.fpNet','Primaire factor warmtenet (zonder verklaring)','number')}${F('P.pwarmte','Warmteprijs warmtenet (€/kWh)','number')}</div></div>
 <div class="card"><details class="pr-det"><summary>Prijslijst maatregelen (indicatief, incl. btw)</summary><div class="pr-list">${MAATR.map(m=>`<label class="pr-row"><span class="pr-n">${esc(m.n)}<small>${esc(PRIJS_EH[m.k]||'')}</small></span><span class="pr-in"><input inputmode="decimal" data-k="prijzen.${m.k}" placeholder="${PRIJS0[m.k]}"><em>€</em></span></label>`).join('')}</div>
  <p class="muted">Leeg = standaardprijs (gemiddeld marktniveau 2026, incl. btw, excl. subsidie).</p></details></div>`;
 bindInputs($('#view'),S.cur);
 $('#dl').querySelectorAll('button').forEach(b=>b.onclick=()=>{const l=b.dataset.l,i=d.labels.indexOf(l);if(i>=0)d.labels.splice(i,1);else d.labels.push(l);d.labels.sort((x,y)=>ORDE.indexOf(x)-ORDE.indexOf(y));b.classList.toggle('on');save()});
 $('#ex').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.x,i=d.uitsluiten.indexOf(k);if(i>=0)d.uitsluiten.splice(i,1);else d.uitsluiten.push(k);b.classList.toggle('on');save()});
 $('#view').querySelectorAll('[data-route]').forEach(c=>c.onchange=()=>{d.routes=ROUTES.map(r=>r.k).filter(k=>$('#view').querySelector(`[data-route="${k}"]`).checked);save()});
 $('#bouw').onclick=()=>{if(!d.labels.length)return toast('Kies minimaal één doellabel');if(!d.routes.length)return toast('Kies minimaal één route');
  const go=()=>{bouwAlle();S.tab='pakket';shell();scrollTo(0,0)};if(a.pakketten.length&&a.pakketten.some(p=>p.handmatig))confirmBox('De bestaande pakketten (met handmatige wijzigingen) worden vervangen. Doorgaan?',go,'Vervangen');else go()}}
function bouwAlle(a=S.cur){const H=huidig(a),d=a.doel;const L=[...d.labels].sort((x,y)=>ORDE.indexOf(x)-ORDE.indexOf(y)),R=ROUTES.filter(r=>d.routes.includes(r.k));const N=R.length;
 a.pakketten=R.map((r,i)=>{const doel=r.k==='max'?L[L.length-1]:L[Math.min(L.length-1,Math.floor(i*L.length/Math.max(1,N-(R.some(x=>x.k==='max')?1:0))))];
  const lijst=bouwPakket(H.s,r,doel,a,H.P,H.c.k);return{id:uid(),naam:'Pakket '+(i+1)+' – '+r.n,route:r.k,doel,lijst,aanbevolen:false,toelichting:'',ep2Vabi:''}});
 // aanbevolen: laagste investering dat het hoogste gekozen doel haalt, anders het eerste dat een doel haalt
 const res=a.pakketten.map(p=>({p,R:pakRes(p,a)}));const hi=L[L.length-1];
 const kand=res.filter(x=>ORDE.indexOf(x.R.label)>=ORDE.indexOf(hi)).sort((x,y)=>x.R.inv-y.R.inv)[0]||res.filter(x=>ORDE.indexOf(x.R.label)>=ORDE.indexOf(L[0])).sort((x,y)=>x.R.inv-y.R.inv)[0];if(kand)kand.p.aanbevolen=true;save()}

/* ---------- PAKKETTEN ---------- */
function vPakket(){const a=S.cur,H=huidig(a);
 if(!a.pakketten.length){$('#view').innerHTML=`<div class="card"><h2>Nog geen pakketten</h2><p class="muted">Kies bij <b>Doel</b> de doellabels en routes en klik op Pakketten samenstellen.</p><button class="btn" id="gD">Naar Doel</button></div>`;$('#gD').onclick=()=>{S.tab='doel';shell()};return}
 const RS=a.pakketten.map(p=>pakRes(p,a));
 $('#view').innerHTML=`<div class="card"><h2>Overzicht</h2><div class="tbl"><table><tr><th></th><th>Label</th><th class="r">EP2</th><th class="r">Investering</th><th class="r">Besparing/jr</th><th class="r">TVT</th></tr>
  <tr><td>Huidig</td><td>${lblBadge(H.label)}</td><td class="r">${fx(num(a.obj.ep2Label)||H.r.ep2,0)}</td><td class="r">–</td><td class="r">–</td><td class="r">–</td></tr>
  ${a.pakketten.map((p,i)=>`<tr><td>${p.aanbevolen?'★ ':''}${esc(p.naam)}</td><td>${lblBadge(RS[i].label)}</td><td class="r">${fx(RS[i].ep2,0)}</td><td class="r">${eur(RS[i].inv)}</td><td class="r">${eur(RS[i].bespaar)}</td><td class="r">${RS[i].tvt?fx(RS[i].tvt,1)+' jr':'–'}</td></tr>`).join('')}</table></div>
  <p class="muted" style="margin:6px 0 0">EP2 en label zijn berekend met het gekalibreerde model; vul na doorrekenen in Vabi per pakket het <b>EP2 uit Vabi</b> in, dan neemt het rapport die waarde over.</p></div>
  ${a.pakketten.map((p,i)=>pakKaart(p,i,RS[i],H)).join('')}
  <div class="row"><button class="btn sec" id="addP">+ Leeg pakket</button></div>`;
 bindInputs($('#view'),S.cur,(p)=>{if(/ep2Vabi|kostVast|naam/.test(p)){clearTimeout(vPakket._t);vPakket._t=setTimeout(()=>{const y=scrollY;vPakket();scrollTo(0,y)},700)}});
 $('#view').querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>confirmBox('Dit pakket verwijderen?',()=>{a.pakketten.splice(+b.dataset.pdel,1);save();vPakket()}));
 $('#view').querySelectorAll('[data-prec]').forEach(b=>b.onclick=()=>{a.pakketten.forEach((p,i)=>p.aanbevolen=i===+b.dataset.prec);save();vPakket()});
 $('#view').querySelectorAll('[data-mdel]').forEach(b=>b.onclick=()=>{const [pi,mi]=b.dataset.mdel.split('.').map(Number);a.pakketten[pi].lijst.splice(mi,1);a.pakketten[pi].handmatig=true;save();const y=scrollY;vPakket();scrollTo(0,y)});
 $('#view').querySelectorAll('[data-madd]').forEach(s=>s.onchange=()=>{if(!s.value)return;const pi=+s.dataset.madd,p=a.pakketten[pi],o={k:s.value};if(s.value==='pv')o.kWp=pvMax(H.s).kWp;p.lijst.push(o);p.handmatig=true;save();const y=scrollY;vPakket();scrollTo(0,y)});
 $('#view').querySelectorAll('[data-prod]').forEach(s=>s.onchange=()=>{const [pi,mi]=s.dataset.prod.split('.').map(Number);a.pakketten[pi].lijst[mi].bcrg=s.value;a.pakketten[pi].handmatig=true;save();const y=scrollY;vPakket();scrollTo(0,y)});
 $('#view').querySelectorAll('[data-kwp]').forEach(s=>s.onchange=()=>{const [pi,mi]=s.dataset.kwp.split('.').map(Number);a.pakketten[pi].lijst[mi].kWp=num(s.value);save();const y=scrollY;vPakket();scrollTo(0,y)});
 $('#view').querySelectorAll('[data-pdoel]').forEach(s=>s.onchange=()=>{const p=a.pakketten[+s.dataset.pdoel];p.doel=s.value;save()});
 $('#view').querySelectorAll('[data-preb]').forEach(b=>b.onclick=()=>{const p=a.pakketten[+b.dataset.preb],r=ROUTES.find(x=>x.k===p.route)||ROUTES[0];p.lijst=bouwPakket(H.s,r,p.doel,a,H.P,H.c.k);p.handmatig=false;save();const y=scrollY;vPakket();scrollTo(0,y)});
 $('#addP').onclick=()=>{a.pakketten.push({id:uid(),naam:'Pakket '+(a.pakketten.length+1)+' – eigen samenstelling',route:'',doel:a.doel.labels[0]||'A',lijst:[],aanbevolen:false,toelichting:'',ep2Vabi:'',handmatig:true});save();vPakket()}}
function pakKaart(p,i,R,H){const a=S.cur,used=new Set(p.lijst.map(o=>M[o.k]&&M[o.k].grp));const tus=pasToe(H.s,p.lijst,a).s;
 const vrij=MAATR.filter(m=>!used.has(m.grp)&&m.ok(tus));const dm=dumavaToets(p,R,H);
 return`<div class="card pk${p.aanbevolen?' rec':''}"><div class="pk-h"><input data-k="pakketten.${i}.naam" class="pk-n"><button class="btn ghost" data-pdel="${i}" title="Verwijderen" style="color:#b3261e">✕</button></div>
  <p class="muted" style="margin:2px 0 8px">${esc((ROUTES.find(r=>r.k===p.route)||{d:'Eigen samenstelling.'}).d)}</p>
  <div class="row" style="gap:10px;margin-bottom:8px">${lblBadge(H.label)}<span>→</span>${lblBadge(R.label,1)}<span class="muted">${R.stap>0?'+'+R.stap+' labelstap'+(R.stap>1?'pen':''):''} · EP2 ${fx(R.ep2,0)}${R.ep2Vabi!=null?' (Vabi)':''} · EP3 ${fx(R.r.ep3,0)}%</span>
   <span style="margin-left:auto" class="row"><label class="muted" style="margin:0">doel</label><select data-pdoel="${i}" style="width:auto;padding:6px">${DOEL_LBL.map(l=>`<option${l===p.doel?' selected':''}>${l}</option>`).join('')}</select>${p.route?`<button class="btn sec" data-preb="${i}" title="Opnieuw samenstellen naar dit doel">↻</button>`:''}</span></div>
  <div class="kpi"><div><b>${eur(R.inv)}</b><span>investering (incl. btw)</span></div><div><b>${eur(R.bespaar)}</b><span>besparing per jaar</span></div><div><b>${R.tvt?fx(R.tvt,1)+' jr':'–'}</b><span>terugverdientijd</span></div></div>
  <div class="mlist">${p.lijst.map((o,mi)=>mRegel(p,i,o,mi,R.regels[mi])).join('')||'<p class="muted">Nog geen maatregelen.</p>'}</div>
  <div class="row" style="margin-top:8px"><select data-madd="${i}" style="flex:1"><option value="">+ Maatregel toevoegen…</option>${vrij.map(m=>`<option value="${m.k}">${esc(m.n)}</option>`).join('')}</select></div>
  <div class="grid"><div><label>EP2 uit Vabi (na doorrekenen)</label><input data-k="pakketten.${i}.ep2Vabi" inputmode="decimal" placeholder="model: ${fx(R.r.ep2,1)}"></div>
   <div><label>Aanbevolen</label><button class="btn ${p.aanbevolen?'':'sec'}" data-prec="${i}" style="width:100%">${p.aanbevolen?'★ Aanbevolen pakket':'Markeer als aanbevolen'}</button></div>
   ${TA('pakketten.'+i+'.toelichting','Toelichting bij dit pakket (rapport)')}</div>
  <p class="muted" style="margin:6px 0 0">Gas ${f0(R.r.gasM3)} m³${R.gasWerk!=null?' (verwacht werkelijk ± '+f0(R.gasWerk)+' m³)':''} · stroom ${f0(R.r.el)} kWh${R.r.pv?' · PV '+f0(R.r.pv)+' kWh':''} · CO₂ −${f0(R.co2red)} kg/jr · aanvoer ${R.r.T} °C${R.s._dGO?' · <b>Ag −'+fx(R.s._dGO,1)+' m²</b> (voorzetwand)':''}${R.s.mWa!==H.s.mWa?' · wanden '+esc(R.s.mWa):''}</p>
  ${a.obj.soort==='dumava'?`<p class="${dm.ok?'okmsg':'warn'}" style="margin-top:8px">${dm.html}</p>`:''}</div>`}
function mRegel(p,pi,o,mi,rg){const m=M[o.k];if(!m)return'';const opts=BCRG_SOORT[o.k]?bcrgOptiesVoor(o.k,rg):null;
 return`<div class="mr"><div class="mr-h"><b>${esc(m.n)}</b><span class="mr-k">${eur(rg?rg.kost:0)}</span><button class="cl-del" data-mdel="${pi}.${mi}" title="Weghalen">×</button></div>
  ${opts?`<select data-prod="${pi}.${mi}">${opts.map(x=>`<option value="${esc(bcrgKey(x))}"${bcrgKey(x)===o.bcrg?' selected':''}>${esc(x.nr+' · '+x.tit.slice(0,46)+' – '+x.ty.slice(0,40)+' · '+x.d+' mm · Rc '+fx(x.rc))}</option>`).join('')}</select>`:''}
  ${o.k==='pv'?`<div class="vl-g"><label>vermogen <input data-kwp="${pi}.${mi}" value="${esc(fx(o.kWp??0,1))}" inputmode="decimal"> kWp</label></div>`:''}
  <div class="mr-d">${rg&&rg.prod?`BCRG <a href="${esc(bcrgUrl(rg.prod))}" target="_blank" rel="noopener">${esc(rg.prod.nr)}</a> · ${esc(rg.prod.fab)} · ${rg.prod.d} mm · Rc ${fx(rg.prod.rc)} · `:''}${rg?fx(rg.hv,o.k==='pv'?1:0)+' '+esc((PRIJS_EH[o.k]||'').split(' (')[0]):''}${rg&&rg.dGO>0?' · Ag −'+fx(rg.dGO,1)+' m²':''}</div>
  <div class="vl-g"><label>vaste prijs (optioneel) € <input data-k="pakketten.${pi}.lijst.${mi}.kostVast" inputmode="decimal" style="width:100px"></label></div></div>`}
function bcrgOptiesVoor(k,rg){const s=huidig().s;const doel=k==='spouw'?1.7:/dak/.test(k)?6.3:k==='bodem'?3.5:4.0;const maxD=k==='spouw'?(num(s.spouwB)||60):k==='voorzet'?200:260;const minD=k==='spouw'?maxD-9:0;
 const L=bcrgOpties(k,doel,maxD,minD,30);if(rg&&rg.prod&&!L.some(x=>bcrgKey(x)===bcrgKey(rg.prod)))L.unshift(rg.prod);return L}

/* ---------- DUMAVA-toets ---------- */
function dumavaToets(p,R,H){const fout=[],ok=[];const ein=R.label,st=R.stap;
 if(st>=3)ok.push('≥ 3 labelstappen ('+H.label+' → '+ein+')');else fout.push('minder dan 3 labelstappen ('+H.label+' → '+ein+')');
 if(ORDE.indexOf(ein)>=ORDE.indexOf('B'))ok.push('eindlabel B of beter');else fout.push('eindlabel slechter dan B');
 R.regels.forEach(rg=>{const pr=rg.prod;if(!pr)return;const eis=/dak/.test(rg.k)?6.3:rg.k==='bodem'?3.5:rg.k==='spouw'?null:4.0;if(eis==null)return;
  const s0=H.s;let rcNa=pr.rc;if(rg.k==='voorzet'||rg.k==='buiten')rcNa=pr.rc+Math.max(0,minRc(gevelsMee(s0),g=>g.Rc)-RAD.gevel);if(/dak/.test(rg.k))rcNa=pr.rc+Math.max(0,minRc(s0.daken||[],d=>d.Rc)-RAD.dak);if(rg.k==='vloer')rcNa=pr.rc+Math.max(0,(s0.vloer.Rc||0)-RAD.vloer);
  if(rcNa+1e-9<eis)fout.push(M[rg.k].n+': Rc '+fx(rcNa)+' < '+fx(eis,1)+' (C.2)');else ok.push(M[rg.k].n+': Rc '+fx(rcNa)+' ≥ '+fx(eis,1))});
 if(R.regels.some(r=>r.k==='hrpp'))ok.push('HR++: Ug ≤ 1,2 (C.1) – meldcode controleren');
 return{ok:!fout.length,html:(fout.length?'<b>DUMAVA integraal (P.1): voldoet nog niet</b> – '+fout.map(esc).join('; '):'<b>DUMAVA integraal (P.1): voldoet</b>')+(ok.length?'<br><span class="muted">'+ok.map(esc).join(' · ')+'</span>':''),fout,okL:ok}}

</script>
</body>
