<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#eceff0;--card:#f9fafa;--ink:#17201d;--muted:#5f6b67;--line:#d3d9d7;--acc:#1f6f5c;--acc2:#e1efea;--warn:#b5462e;--hi:#ff7a1a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:1000;background:var(--acc);color:#fff;padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top))}
header h1{font-size:17px;margin:0 0 8px}
.kop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.kop h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.homeknop{flex:none;display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:5px 11px;margin-top:-3px;background:rgba(255,255,255,.12)}
.steps{display:flex;gap:4px;font-size:12px}
.steps span{flex:1;text-align:center;padding:4px 2px;border-radius:6px;background:rgba(255,255,255,.15);cursor:pointer}
.steps span.on{background:#fff;color:var(--acc);font-weight:600}
main{padding:12px;max-width:920px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button,.knop{font-size:15px;padding:10px 13px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.ghost{background:transparent;color:var(--acc)}
button.small{font-size:13.5px;padding:6px 10px}
button.del{border-color:var(--warn);color:var(--warn);background:transparent}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--muted);font-weight:500}
.note{font-size:13px;color:var(--muted)}.err{color:var(--warn);font-size:14px}
.ihead{display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:8px}
.choice{display:flex;gap:6px;flex-wrap:wrap}.choice button{flex:1 1 30%;background:var(--card);color:var(--ink);border-color:var(--line);font-size:13.5px;padding:8px 6px}
.choice button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.res{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.sug{border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden;background:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:1000}
.bar button{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:5000;max-width:90vw;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:4000;padding:16px}
#modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:420px;width:100%;white-space:pre-line}
#modal .row{margin-top:16px}#mkeuze button{width:100%;margin-top:8px}
[hidden]{display:none!important}
.vtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.vtabs button{white-space:nowrap;background:var(--card);color:var(--ink);border-color:var(--line);font-size:14px;padding:7px 11px}
.vtabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#cvwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#cv{display:block;width:100%;height:54vh;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.cvk{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.cvk button{width:40px;height:40px;padding:0;font-size:18px;background:rgba(255,255,255,.92)}
.tot{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.93);font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);line-height:1.35;pointer-events:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tools button{flex:1 1 auto;font-size:14px;padding:9px 8px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:600}table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t tr.sub td{font-weight:700;background:var(--acc2)}table.t tr.min td{color:var(--muted)}
.wt td{padding:4px 3px}.wt select,.wt input{padding:6px;font-size:14px}
.op{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:#fff}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}
.advies{margin-top:8px;padding:9px 10px;border-radius:9px;background:#fdf1e6;border:1px solid #f2cfa9;font-size:13.5px}
.ok{margin-top:8px;padding:9px 10px;border-radius:9px;background:var(--acc2);font-size:13.5px}
.prev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;margin:8px 0}.prev svg{width:100%;height:auto;display:block}
.big{font-size:22px;font-weight:700}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.sumgrid div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.sumgrid small{display:block;color:var(--muted);font-size:12px}
details.card>summary{cursor:pointer;font-weight:600}

<header><div class="kop"><h1 id="titel">Plattegrond NEN 2580</h1><a class="homeknop" href="opname.html" id="terug">← Opname</a></div><div class="steps" id="steps"></div></header>

<datalist id="namen"></datalist>
<script>
// =====================================================================
//  Plattegrond NEN 2580 · meetinstructie gebruiksoppervlakte + bruto inhoud woningen (juli 2019)
//  Ruimtes inmeten → Funda-plattegrond (JPG/PNG), meetrapport (PDF) en FML voor Floorplanner
// =====================================================================
const APPVERSIE='2026-11-07';
const KEY='plattegrondApp_v1',OKEY='opnameApp_v1';
let store=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{projecten:[],instel:{}}}catch(e){return{projecten:[],instel:{}}}})();
if(!store.instel)store.instel={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){toast('Opslaan lukte niet (geheugen vol?)')}}
let cur=null,scherm='lijst',vi=0,sel=null,selEdge=-1,UNDO=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const f2=n=>n==null||isNaN(n)?'–':(Math.round(n*100)/100).toFixed(2).replace('.',',');
const f1=n=>n==null||isNaN(n)?'–':(Math.round(n*10)/10).toFixed(1).replace('.',',');
const fi=n=>n==null||isNaN(n)?'–':String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const inV=n=>n==null?'':String(n).replace('.',',');
const uid=()=>Math.random().toString(36).slice(2,9);
const rnd=n=>Math.round(n*1e6)/1e6;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function vraag(tekst,ja='Ja',nee='Nee'){return new Promise(res=>{const m=$('#modal');$('#mtekst').textContent=tekst;$('#mja').textContent=ja;$('#mnee').textContent=nee;$('#mja').hidden=false;m.style.display='flex';
 const klaar=v=>{m.style.display='none';$('#mja').onclick=$('#mnee').onclick=null;res(v)};$('#mja').onclick=()=>klaar(true);$('#mnee').onclick=()=>klaar(false)})}
function kies(tekst,lijst){return new Promise(res=>{const m=$('#modal'),k=$('#mkeuze');$('#mtekst').textContent=tekst;
 k.innerHTML=lijst.map((l,i)=>`<button class="ghost" data-kz="${i}">${esc(l)}</button>`).join('');k.hidden=false;$('#mja').hidden=true;$('#mnee').textContent='Annuleren';m.style.display='flex';
 const klaar=v=>{m.style.display='none';k.hidden=true;k.innerHTML='';k.onclick=null;$('#mja').hidden=false;$('#mnee').onclick=null;res(v)};
 k.onclick=e=>{const b=e.target.closest('[data-kz]');if(b)klaar(+b.dataset.kz)};$('#mnee').onclick=()=>klaar(null)})}

// ---------- definities ----------
const NORM={bbmi:{k:'Meetinstructie (NVM / BBMI)',l:'Meetinstructie gebruiksoppervlakte en bruto inhoud woningen (juli 2019), gebaseerd op NEN 2580',kort:'Gemeten volgens de meetinstructie (NVM/BBMI, juli 2019), gebaseerd op NEN 2580'},
 nen2580:{k:'NEN 2580 (strikt)',l:'NEN 2580:2007+C1:2008 Oppervlakten en inhouden van gebouwen',kort:'Gemeten volgens NEN 2580:2007+C1:2008'}};
const norm=()=>cur.norm==='nen2580'?'nen2580':'bbmi';
const BRONNEN=[['NVM – Meetinstructie (branchebreed, Funda)','https://www.nvm.nl/wonen/verkopen/meetinstructie/'],['Meetinstructie gebruiksoppervlakte woningen (juli 2019)','https://www.nvm.nl/media/bqnjrtdg/meetinstructie-gebruiksoppervlakte-woningen-juli-2019.pdf'],
 ['Meetinstructie bruto inhoud woningen (juli 2019)','https://repository.officiele-overheidspublicaties.nl/externebijlagen/exb-2022-2138/currentitem'],['Waarderingskamer – meetinstructies en lijst met vragen','https://www.waarderingskamer.nl/hulpmiddelen-gemeenten/meetinstructies-gebruiksoppervlakte-inhoud/'],
 ['NEN 2580:2007 Oppervlakten en inhouden van gebouwen','https://www.nen.nl/nen-2580-2007-nl-113982'],['NEN 2580 correctieblad C1:2008','https://www.nen.nl/nen-2580-2007-c1-2008-nl-129082'],['NTA 2581 meetrapporten volgens NEN 2580','https://www.nen.nl/bouw/beheer-en-onderhoud/oppervlaktebepaling'],
 ['Floorplanner FML v3.0-specificatie','https://floorplanner.readme.io/reference/v30-specification']];
const CAT={wonen:{l:'Wonen',k:'GO wonen',c:'#1f6f5c'},oir:{l:'Overige inpandige ruimte',k:'Overige inpandige ruimte',c:'#b7791f'},buiten:{l:'Gebouwgebonden buitenruimte',k:'Buitenruimte',c:'#4f8a3a'},extern:{l:'Externe bergruimte',k:'Externe berging',c:'#6b5b95'},nvt:{l:'Telt niet mee',k:'Niet meetellen',c:'#8a8a8a'}};
const CATUITLEG={wonen:'Alles wat niet onder de andere criteria valt (ook keuken, hal, badkamer, toilet, meterkast, trapkast, bijkeuken). Bij twijfel: wonen.',
 oir:'Hoogste punt tussen 1,5 en 2,0 m; of deel boven 2,0 m kleiner dan 4 m²; bouwkundig alleen bergruimte (kelder, garage, fietsenstalling, inpandige berging); bergzolder (geen vaste trap of raam < 0,5 m²).',
 buiten:'Balkon, dakterras, loggia, veranda, carport. Overdekt: meten tot de projectie van de overkapping; niet overdekt: tot hek, dakopstand of vloerrand.',
 extern:'Buiten de woning, alleen bereikbaar door de woning te verlaten, geen gedeelde muur met de woning, afsluitbaar en een apart BAG-pand (schuur, tuinberging).',
 nvt:'Niet toegankelijke ruimte of kruipruimte: telt niet mee voor de gebruiksoppervlakte.'};
const WS={binnen:'Binnenwand',buiten:'Gevel / buitenmuur',scheidend:'Woningscheidend',open:'Open (geen wand)'};
const WT={binnen:0.10,buiten:0.30,scheidend:0.30,open:0};
const NAMEN=['Woonkamer','Keuken','Woonkamer / keuken','Slaapkamer','Badkamer','Toilet','Hal','Entree','Overloop','Gang','Bijkeuken','Wasruimte','Studeerkamer','Werkkamer','Inloopkast','Meterkast','Trapkast','Zolder','Vliering','Bergzolder','Berging','Garage','Kelder','Technische ruimte','Serre','Erker','Balkon','Dakterras','Loggia','Veranda','Carport','Schuur','Tuinberging','Kruipruimte'];
$('#namen').innerHTML=NAMEN.map(n=>`<option value="${n}">`).join('');
function catVoorNaam(n){n=String(n||'').toLowerCase();if(/balkon|dakterras|terras|loggia|veranda|carport|overkapping/.test(n))return'buiten';if(/schuur|tuinberging|tuinhuis|buitenberging/.test(n))return'extern';if(/kruipruimte/.test(n))return'nvt';if(/garage|kelder|berging|vliering|bergzolder|stalling/.test(n))return'oir';return'wonen'}
const THEMA_STD='premium';const THEMA={premium:{muur:'#2b2b2b',vloer:'#f1e6d3',nat:'#f3f5f6',buiten:'#e8e4dc',lijn:'#4a4a4a',txt:'#1f1f1f',sub:'#6a6a6a',kader:'#2b2b2b',glas:'#dcebf5',pat:true,schaduw:true},
 funda:{muur:'#3a3a3a',vloer:'#ffffff',nat:'#ffffff',buiten:'#f0f3ec',lijn:'#5a5a5a',txt:'#2b2b2b',sub:'#707070',kader:'#3a3a3a',glas:'#ffffff'},
 warm:{muur:'#3b3530',vloer:'#f7f1e8',nat:'#eaf0f4',buiten:'#e6eee0',lijn:'#5b534c',txt:'#2e2925',sub:'#7a7068',kader:'#3b3530',glas:'#e8f0f5'}};
const TEGEL=/badkamer|toilet|douche|wasruimte|bijkeuken|\bwc\b|hal\b|entree|^keuken/i,BETON=/garage|berging|kelder|schuur|technische|meterkast|stalling|carport|kruipruimte/i,HOUTBUITEN=/balkon|dakterras|loggia/i;
function vulling(r,T){if(r.cat==='nvt')return'#f1f1f1';if(!T.pat){return r.cat==='buiten'?T.buiten:NAT.test(r.naam)?T.nat:T.vloer}
 if(r.cat==='buiten')return HOUTBUITEN.test(r.naam)?'url(#pDek)':BETON.test(r.naam)?'url(#pBeton)':'url(#pTerras)';
 if(BETON.test(r.naam))return'url(#pBeton)';if(TEGEL.test(r.naam.trim()))return'url(#pTegel)';return'url(#pHout)'}
function defs(T,ed){if(!T.pat)return'';let hout='';for(let i=0;i<4;i++){const y=i*.15,j=[.0,.8,.35,1.15][i];hout+=`<line x1="0" y1="${y}" x2="1.6" y2="${y}" stroke="#ddcdb2" stroke-width=".008"/><line x1="${j}" y1="${y}" x2="${j}" y2="${y+.15}" stroke="#ddcdb2" stroke-width=".008"/><line x1="${(j+.05).toFixed(2)}" y1="${(y+.05).toFixed(3)}" x2="${(j+.6).toFixed(2)}" y2="${(y+.055).toFixed(3)}" stroke="#e9dcc6" stroke-width=".006"/>`}
 return`<defs><pattern id="pHout" patternUnits="userSpaceOnUse" width="1.6" height=".6"><rect width="1.6" height=".6" fill="#f1e6d3"/>${hout}</pattern>
 <pattern id="pTegel" patternUnits="userSpaceOnUse" width=".3" height=".3"><rect width=".3" height=".3" fill="#f3f5f6"/><path d="M0,0H.3M0,0V.3" stroke="#d9dfe3" stroke-width=".007"/></pattern>
 <pattern id="pTerras" patternUnits="userSpaceOnUse" width=".6" height=".6"><rect width=".6" height=".6" fill="#e8e4dc"/><path d="M0,0H.6M0,0V.6" stroke="#d3cdc1" stroke-width=".01"/></pattern>
 <pattern id="pDek" patternUnits="userSpaceOnUse" width="2" height=".56"><rect width="2" height=".56" fill="#e2d2b8"/><path d="M0,0H2M0,.14H2M0,.28H2M0,.42H2M.6,0V.14M1.5,.14V.28M.2,.28V.42M1.1,.42V.56" stroke="#cbb594" stroke-width=".008"/></pattern>
 <pattern id="pBeton" patternUnits="userSpaceOnUse" width="1" height="1"><rect width="1" height="1" fill="#ecebe8"/><circle cx=".2" cy=".3" r=".01" fill="#dcdad5"/><circle cx=".7" cy=".75" r=".012" fill="#dcdad5"/><circle cx=".55" cy=".15" r=".008" fill="#dcdad5"/></pattern>
 ${!ed&&T.schaduw?'<filter id="fS" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx=".025" dy=".04" stdDeviation=".045" flood-color="#000" flood-opacity=".28"/></filter>':''}</defs>`}
const NAT=/badkamer|toilet|douche|wasruimte|bijkeuken|wc\b/i;

// ---------- project ----------
function nieuweVerd(naam,laag){return{id:uid(),naam,laag,hoogte:'2,90',kap:'geen',hLaag:'',hHoog:'',oppKap:'',corr:'',corrTxt:'',ruimtes:[],els:[]}}
function nieuwProject(){return{id:uid(),datum:new Date().toISOString(),adres:null,bag:null,opnameId:null,woningtype:'eengezins',opnemer:'',odatum:new Date().toISOString().slice(0,10),
 voorZijde:'onder',voorAz:null,noordHand:'',instel:{m2:true,maten:true,buitenmaten:true,noord:true,schaal:true,adres:false,stijl:'premium',bron:true,oppTitel:true},verdiepingen:[nieuweVerd('Begane grond',1)]}}
function nieuweRuimte(naam='Ruimte',b=3,d=3){return{id:uid(),naam,cat:catVoorNaam(naam),vorm:'rect',b,d,segs:[{l:'4',a:90},{l:'3',a:90},{l:'2',a:-90},{l:'2',a:90},{l:'2',a:90}],x:0,y:0,rot:0,w:[],ops:[],hMax:'',d2:''}}
function nieuwEl(s){const m={trap:{b:0.9,d:3.6,label:'',treden:14},vide:{b:2.5,d:2,label:'Vide'},schacht:{b:0.6,d:0.6,label:''},kolom:{b:0.3,d:0.3,label:''}}[s];return{id:uid(),soort:s,x:0,y:0,rot:0,...m}}

// ---------- geometrie ----------
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,k)=>[a[0]*k,a[1]*k],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const rot=([x,y],d)=>{const a=d*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return[x*c-y*s,x*s+y*c]};
const pts=P=>P.map(p=>p[0].toFixed(4)+','+p[1].toFixed(4)).join(' ');
function lokaal(r){if(r.vorm!=='poly')return[[0,0],[num(r.b)||0,0],[num(r.b)||0,num(r.d)||0],[0,num(r.d)||0]];
 let h=0,x=0,y=0;const P=[[0,0]];(r.segs||[]).forEach(s=>{const l=num(s.l)||0,a=h*Math.PI/180;x=rnd(x+l*Math.cos(a));y=rnd(y+l*Math.sin(a));P.push([x,y]);h+=(num(s.a)??90)});
 if(Math.hypot(x,y)<0.005)P.pop();return P}
function syncW(r){const n=lokaal(r).length;if(!r.w)r.w=[];while(r.w.length<n)r.w.push({s:'binnen',t:'0,10',laag:''});if(r.w.length>n)r.w.length=n;r.ops=(r.ops||[]).filter(o=>o.z<n);return r}
function geo(r){const P=lokaal(r).map(p=>{const q=rot(p,r.rot||0);return[rnd(q[0]+(+r.x||0)),rnd(q[1]+(+r.y||0))]});const n=P.length;let A=0;
 for(let i=0;i<n;i++){const q=P[(i+1)%n];A+=P[i][0]*q[1]-q[0]*P[i][1]}A/=2;const sg=A>=0?1:-1;
 const E=P.map((p,i)=>{const q=P[(i+1)%n],dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1e-9,u=[dx/L,dy/L];return{a:p,b:q,u,n:sg>0?[u[1],-u[0]]:[-u[1],u[0]],L}});
 return{P,E,A:Math.abs(A)}}
const wt=w=>w.s==='open'?0:(num(w.t)??WT[w.s]);

function scan(poly,G,cb){const{minx,miny,c,W,H}=G;let y0=Infinity,y1=-Infinity;for(const p of poly){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
 const j0=Math.max(0,Math.ceil((y0-miny)/c-.5-1e-7)),j1=Math.min(H-1,Math.floor((y1-miny)/c-.5+1e-7));
 for(let j=j0;j<=j1;j++){const yc=miny+(j+.5)*c,xs=[];for(let i=0,k=poly.length-1;i<poly.length;k=i++){const[xa,ya]=poly[k],[xb,yb]=poly[i];if((ya>yc)!==(yb>yc))xs.push(xa+(yc-ya)*(xb-xa)/(yb-ya))}
  xs.sort((a,b)=>a-b);for(let q=0;q+1<xs.length;q+=2){const i0=Math.max(0,Math.ceil((xs[q]-minx)/c-.5-1e-7)),i1=Math.min(W-1,Math.floor((xs[q+1]-minx)/c-.5+1e-7)),row=j*W;for(let i=i0;i<=i1;i++)cb(row+i)}}}
function bereken(v){const R=v.ruimtes.map((r,i)=>({r,g:geo(syncW(r)),i}));const nul=()=>({wonen:0,oir:0});
 const res={v,ruimtes:R.map(({r,g})=>({id:r.id,naam:r.naam,cat:r.cat,opp:g.A,maat:r.vorm!=='poly'?`${f2(num(r.b))} × ${f2(num(r.d))}`:'vrije vorm'})),
  netto:nul(),wand:nul(),laag:nul(),vide:nul(),schacht:nul(),go:nul(),ggb:0,eb:0,bvo:0,inhoud:0,overlap:0,aftrekEls:[]};
 R.forEach(({r,g})=>{if(r.cat==='buiten')res.ggb+=g.A;if(r.cat==='extern')res.eb+=g.A});
 const B=R.filter(x=>['wonen','oir','nvt'].includes(x.r.cat));
 if(B.length){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;const inc=P=>P.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)});
  B.forEach(({r,g})=>inc(offs(g,r.w.map(wt))));let c=.01;let W=Math.ceil((x1-x0)/c)+6,H=Math.ceil((y1-y0)/c)+6;if(W*H>9e6){c=.02;W=Math.ceil((x1-x0)/c)+6;H=Math.ceil((y1-y0)/c)+6}
  const G={minx:Math.floor(x0/c)*c-3*c,miny:Math.floor(y0/c)*c-3*c,c,W,H};const N=W*H,cat=new Uint8Array(N),rid=new Uint16Array(N),bvo=new Uint8Array(N);const c2=c*c;
  const tel=()=>{let a=0,b=0;for(let i=0;i<N;i++){if(cat[i]===2)b++;else if(cat[i]===1)a++}return{wonen:b*c2,oir:a*c2}};
  // BVO: gevels volledig, woningscheidend tot hart, binnenwanden half (de buurruimte vult de andere helft)
  B.forEach(({r,g})=>scan(offs(g,r.w.map(w=>w.s==='buiten'?wt(w):w.s==='open'?0:wt(w)/2)),G,k=>{bvo[k]=1}));let nb=0;for(let i=0;i<N;i++)nb+=bvo[i];res.bvo=nb*c2;
  // stap 1: vloeren van de ruimtes
  let som=0;B.forEach(({r,g,i})=>{som+=g.A;const cv=r.cat==='wonen'?2:r.cat==='oir'?1:0;scan(g.P,G,k=>{rid[k]=i+1;cat[k]=cv})});
  const n0=tel();res.netto=n0;res.overlap=Math.max(0,som-B.reduce((s2,x)=>s2,0)-(()=>{let a=0;for(let i=0;i<N;i++)if(rid[i])a++;return a*c2})());
  // binnenwanden tellen mee (incl. dragend). Wand tussen wonen en overige inpandige ruimte telt als wonen.
  const nen=norm()==='nen2580',bw=(w,f)=>w.s==='binnen'&&!(nen&&w.dragend)?wt(w)*f:0;
  B.filter(x=>x.r.cat==='oir').forEach(({r,g})=>scan(offs(g,r.w.map(w=>bw(w,.5))),G,k=>{if(!rid[k]&&cat[k]===0)cat[k]=1}));
  B.filter(x=>x.r.cat==='wonen').forEach(({r,g})=>scan(offs(g,r.w.map(w=>bw(w,nen?.5:1))),G,k=>{if(!rid[k])cat[k]=2}));
  const n1=tel();res.wand={wonen:n1.wonen-n0.wonen,oir:n1.oir-n0.oir};
  // delen lager dan 1,5 m
  B.forEach(({r,g,i})=>g.E.forEach((e,j)=>{const lw=num(r.w[j]?.laag);if(!lw)return;scan([e.a,e.b,add(e.b,mul(e.n,-lw)),add(e.a,mul(e.n,-lw))],G,k=>{if(rid[k]===i+1)cat[k]=0})}));
  const n2=tel();res.laag={wonen:n1.wonen-n2.wonen,oir:n1.oir-n2.oir};
  // trapgat / vide >= 4 m²
  v.els.filter(e=>e.soort==='vide').forEach(e=>{const P=elPoly(e),A=areaP(P);if(Math.round(A*100)/100>=4){res.aftrekEls.push({soort:e.label||'Vide / trapgat',A});scan(P,G,k=>{cat[k]=0})}});
  const n3=tel();res.vide={wonen:n2.wonen-n3.wonen,oir:n2.oir-n3.oir};
  // schacht, inspringend of vrijstaand bouwdeel >= 0,5 m²
  v.els.filter(e=>e.soort==='schacht'||e.soort==='kolom').forEach(e=>{const P=elPoly(e),A=areaP(P);if(Math.round(A*100)/100>=.5){res.aftrekEls.push({soort:e.soort==='schacht'?'Schacht':'Kolom / bouwdeel',A});scan(P,G,k=>{cat[k]=0})}});
  const n4=tel();res.schacht={wonen:n3.wonen-n4.wonen,oir:n3.oir-n4.oir};res.go=n4}
 // bruto inhoud (meetinstructie bruto inhoud woningen)
 const h=num(v.hoogte)||0,gem=((num(v.hLaag)||0)+(num(v.hHoog)||0))/2;
 if(v.kap==='kap')res.inhoud=res.bvo*gem;else if(v.kap==='deels'){const ok=Math.min(res.bvo,num(v.oppKap)||0);res.inhoud=(res.bvo-ok)*h+ok*gem}else res.inhoud=res.bvo*h;
 res.inhoud+=num(v.corr)||0;return res}
function berekenAlles(){const L=cur.verdiepingen.map(bereken);const tot={wonen:0,oir:0,ggb:0,eb:0,inhoud:0,bvo:0,vloer:0};

function grepSlepen(ev){const d=drag,r=selR();if(!r)return;const m=naarM(ev),k=VB.w/cvMaat().w,tol=12*k;Object.assign(r,JSON.parse(JSON.stringify(d.r0)));const g0=geo(syncW(r));const t=d.handle[0],i=+d.handle.slice(1);
 if(t==='e'){const e=g0.E[i];let dl=(m[0]-d.m0[0])*e.n[0]+(m[1]-d.m0[1])*e.n[1];
  const ax=Math.abs(e.n[0])>.999?0:Math.abs(e.n[1])>.999?1:-1;if(ax>=0){const s=Math.sign(e.n[ax]),c0=e.a[ax],c=c0+s*dl,tw=wt(r.w[i]);let best=null,bd=tol;
   V().ruimtes.forEach(o=>{if(o===r)return;randen(o).forEach(b=>{if((b.ax==='v')!==(ax===0))return;const cand=b.s===-s?[b.c+b.s*Math.max(tw,b.t||0)-s*0]:[b.c,b.c+b.s*(b.t||0)-s*tw];
    if(b.s===-s)cand[0]=b.c+b.s*Math.max(tw,b.t||0);cand.forEach(x=>{if(Math.abs(x-c)<bd){bd=Math.abs(x-c);best=x}})})});if(best!=null)dl=(best-c0)*s}
  dl=Math.round(dl*100)/100;
  if(r.vorm!=='poly'&&((r.rot||0)%90===0)){const b=num(r.b)||0,dd=num(r.d)||0;const o=(v)=>{const q=rot(v,r.rot||0);r.x=Math.round(((+r.x||0)+q[0])*1000)/1000;r.y=Math.round(((+r.y||0)+q[1])*1000)/1000};
   if(i===1)r.b=Math.max(.2,Math.round((b+dl)*100)/100);else if(i===2)r.d=Math.max(.2,Math.round((dd+dl)*100)/100);else if(i===0){const nd=Math.max(.2,Math.round((dd+dl)*100)/100);o([0,-(nd-dd)]);r.d=nd}else{const nb=Math.max(.2,Math.round((b+dl)*100)/100);o([-(nb-b),0]);r.b=nb}}
  else{const P=d.P0.map(q=>q.slice()),n=P.length;[i,(i+1)%n].forEach(j=>{P[j]=[P[j][0]+e.n[0]*dl,P[j][1]+e.n[1]*dl]});zetPunten(r,P)}}
 else{if(r.vorm!=='poly'){const b=num(r.b)||0,dd=num(r.d)||0;r.vorm='poly';r.segs=[{l:inV(b),a:90},{l:inV(dd),a:90},{l:inV(b),a:90}]}
  const P=d.P0.map(q=>q.slice()),n=P.length;let p=[Math.round(m[0]*100)/100,Math.round(m[1]*100)/100];[P[(i-1+n)%n],P[(i+1)%n]].forEach(q=>{if(Math.abs(p[0]-q[0])<tol)p[0]=q[0];if(Math.abs(p[1]-q[1])<tol)p[1]=q[1]});P[i]=p;zetPunten(r,P)}
 teken()}

function randen(o,dx=0,dy=0){if(o.soort){const P=elPoly(o).map(p=>[p[0]+dx,p[1]+dy]);const out=[];for(let i=0;i<4;i++){const a=P[i],b=P[(i+1)%4];out.push(rand(a,b,P,0))}return out.filter(Boolean)}
 const g=geo(syncW(o));return g.E.map((e,i)=>{const a=[e.a[0]+dx,e.a[1]+dy],b=[e.b[0]+dx,e.b[1]+dy];const x=rand(a,b,null,wt(o.w[i]),e.n);return x}).filter(Boolean)}
function rand(a,b,P,t,n){const dx=b[0]-a[0],dy=b[1]-a[1];if(Math.abs(dx)<1e-6){if(!n){const cx=P.reduce((s,p)=>s+p[0],0)/P.length;n=[a[0]>cx?1:-1,0]}return{ax:'v',c:a[0],lo:Math.min(a[1],b[1]),hi:Math.max(a[1],b[1]),s:Math.sign(n[0]),t}}
 if(Math.abs(dy)<1e-6){if(!n){const cy=P.reduce((s,p)=>s+p[1],0)/P.length;n=[0,a[1]>cy?1:-1]}return{ax:'h',c:a[1],lo:Math.min(a[0],b[0]),hi:Math.max(a[0],b[0]),s:Math.sign(n[1]),t}}return null}
function snap(o,ox,oy,dx,dy,tol){const isEl=!!o.soort;const v=V();const ik=randen(o,ox-(+o.x||0),oy-(+o.y||0));const ander=[];v.ruimtes.forEach(r=>{if(r!==o)ander.push(...randen(r).map(x=>({...x,room:true})))});if(!isEl)v.els.forEach(e=>{});
 const best={v:{d:tol,val:dx},h:{d:tol,val:dy}};
 ik.forEach(a=>{const D=a.ax==='v'?dx:dy,Do=a.ax==='v'?dy:dx;ander.forEach(b=>{if(b.ax!==a.ax)return;const cand=[];
  const ovl=Math.min(a.hi+Do,b.hi)-Math.max(a.lo+Do,b.lo);
  if(isEl){if(a.s===b.s)cand.push(b.c-a.c)}
  else{if(a.s===-b.s&&ovl>-.3){const gap=Math.max(a.t||0,b.t||0);cand.push(b.c+b.s*gap-a.c)}
   if(a.s===b.s){cand.push(b.c-a.c);cand.push(b.c+b.s*(b.t||0)-(a.c+a.s*(a.t||0)))}}
  cand.forEach(c=>{const d=Math.abs(c-D),k=a.ax==='v'?'v':'h';if(d<best[k].d){best[k]={d,val:c}}})})});
 return[best.v.val,best.h.val]}

 $('#fmlIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());let d=null,r=null;const walk=o=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(walk);return}
  if(o.type==='door'&&o.refid&&!d)d=o.refid;if(o.type==='window'&&o.refid&&!r)r=o.refid;Object.values(o).forEach(walk)};walk(j);
  if(d)store.instel.fmlDeur=d;if(r)store.instel.fmlRaam=r;save();toast(d||r?'Gevonden: '+(d?'deur ':'')+(r?'raam':''):'Geen deur of raam gevonden');exportScherm()}catch(x){toast('Kon het bestand niet lezen')}})}
function bestandsnaam(){return(cur.adres?.naam||'plattegrond').replace(/[^\w\- ,]+/g,'').replace(/\s+/g,' ').trim()}
async function svgNaarCanvas(x){const img=new Image();const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x.svg);await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
 const cv=document.createElement('canvas');cv.width=x.w;cv.height=x.h;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,x.w,x.h);c.drawImage(img,0,0,x.w,x.h);return cv}
async function deelAfbeeldingen(fmt){toast('Afbeeldingen maken…');const files=[];
 for(const v of cur.verdiepingen){const x=exportSvg(v);if(!x)continue;const cv=await svgNaarCanvas(x);const blob=await new Promise(r=>cv.toBlob(r,fmt==='png'?'image/png':'image/jpeg',.92));files.push(new File([blob],`${bestandsnaam()} - ${v.naam}.${fmt}`,{type:blob.type}))}
 if(!files.length){toast('Nog niets getekend');return}
 if(navigator.canShare&&navigator.canShare({files})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){try{await navigator.share({files,title:'Plattegronden '+bestandsnaam()});return}catch(e){if(e.name==='AbortError')return}}
 for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,350))}toast(files.length+' bestand(en) gedownload')}

// ---------- FML (Floorplanner Markup Language v3, JSON, centimeters) ----------
function maakFML(){const cm=v=>Math.round(v*1000)/10;const P=p=>({x:cm(p[0]),y:cm(p[1])});let wid=1;
 const floors=cur.verdiepingen.map((v,fi)=>{const H=Math.round(Math.max(2.2,(num(v.hoogte)||2.9)-.3)*100);const R=v.ruimtes.map(r=>({r,g:geo(syncW(r))}));
  // 1. wandsegmenten per ruimtezijde (hartlijn), gedeelde binnenwanden één keer
  const E=[];R.forEach(({r,g},ri)=>{if(r.cat==='buiten')return;const Q=offs(g,r.w.map(w=>wt(w)/2));g.E.forEach((e,i)=>{const w=r.w[i];if(!w||w.s==='open')return;const t=wt(w);if(t<=0)return;E.push({ri,i,e,t,s:w.s,Q0:Q[i],Q1:Q[(i+1)%Q.length],iv:[[0,e.L]],shared:[]})})});
  E.forEach((a,ai)=>E.forEach((b,bi)=>{if(bi<=ai||a.ri===b.ri)return;const dot=a.e.u[0]*b.e.u[0]+a.e.u[1]*b.e.u[1];if(dot>-.999)return;
   const d=(b.e.a[0]-a.e.a[0])*a.e.n[0]+(b.e.a[1]-a.e.a[1])*a.e.n[1];const tt=Math.max(a.t,b.t);if(d<.01||Math.abs(d-tt)>.04)return;
   const pr=p=>(p[0]-a.e.a[0])*a.e.u[0]+(p[1]-a.e.a[1])*a.e.u[1];const s0=Math.max(0,Math.min(pr(b.e.a),pr(b.e.b))),s1=Math.min(a.e.L,Math.max(pr(b.e.a),pr(b.e.b)));if(s1-s0<.05)return;
   a.shared.push({s0,s1,d});const pb=p=>(p[0]-b.e.a[0])*b.e.u[0]+(p[1]-b.e.a[1])*b.e.u[1];const q=[pb(add(a.e.a,mul(a.e.u,s0))),pb(add(a.e.a,mul(a.e.u,s1)))];b.iv=minIv(b.iv,Math.min(...q),Math.max(...q))}));
  const walls=[];const mk=(A,B,t)=>{if(Math.hypot(B[0]-A[0],B[1]-A[1])<.04)return;walls.push({a:P(A),b:P(B),az:{z:0,h:H},bz:{z:0,h:H},thickness:Math.round(t*100),balance:.5,openings:[],decor:{left:null,right:null},_A:A,_B:B,_t:t})};
  E.forEach(x=>{let iv=x.iv;x.shared.forEach(s=>{iv=minIv(iv,s.s0,s.s1);const A=add(add(x.e.a,mul(x.e.u,s.s0)),mul(x.e.n,s.d/2)),B=add(add(x.e.a,mul(x.e.u,s.s1)),mul(x.e.n,s.d/2));mk(A,B,s.d)});
   iv.forEach(([s0,s1])=>{const A=s0<.001?x.Q0:add(add(x.e.a,mul(x.e.u,s0)),mul(x.e.n,x.t/2)),B=s1>x.e.L-.001?x.Q1:add(add(x.e.a,mul(x.e.u,s1)),mul(x.e.n,x.t/2));mk(A,B,x.t)})});
  // 2. openingen op de juiste muur (doorgang = gat in de muur)
  R.forEach(({r,g})=>(r.ops||[]).forEach(op=>{const w=r.w[op.z];if(!w)return;const o=opGeo(g,w,op);if(!o||o.w<=0)return;const c=add(add(o.a,mul(o.e.u,o.w/2)),mul(o.e.n,o.t/2));
   const wi=walls.findIndex(W=>{const L=Math.hypot(W._B[0]-W._A[0],W._B[1]-W._A[1]);return dSeg(c,W._A,W._B)<W._t/2+.03&&L>o.w});if(wi<0)return;const W=walls[wi];const L=Math.hypot(W._B[0]-W._A[0],W._B[1]-W._A[1]),u=mul(sub(W._B,W._A),1/L),s=(c[0]-W._A[0])*u[0]+(c[1]-W._A[1])*u[1];
   const ref=op.soort==='raam'?store.instel.fmlRaam:op.soort==='pui'?(store.instel.fmlPui||store.instel.fmlDeur):store.instel.fmlDeur;
   if(op.soort==='doorgang'||!ref){const s0=s-o.w/2,s1=s+o.w/2;walls.splice(wi,1);const W1={...W,openings:[]},W2={...W,openings:[]};W1._B=add(W._A,mul(u,s0));W1.b=P(W1._B);W2._A=add(W._A,mul(u,s1));W2.a=P(W2._A);[W1,W2].forEach(x=>{if(Math.hypot(x._B[0]-x._A[0],x._B[1]-x._A[1])>.04)walls.push(x)});return}
   const deur=op.soort!=='raam';W.openings.push({type:deur?'door':'window',refid:ref,width:Math.round(o.w*100),z:deur?0:90,z_height:deur?(op.soort==='pui'?230:211):130,t:Math.round(s/L*1e4)/1e4,...(deur?{mirrored:[op.sch==='R'?1:0,op.uit?1:0]}:{})})}));
  walls.forEach(W=>{delete W._A;delete W._B;delete W._t});
  // 3. ruimtes, buitenruimtes, trappen en vides
  const areas=R.map(({r,g})=>({poly:g.P.map(P),color:r.cat==='buiten'?'#e6eee0':NAT.test(r.naam)?'#eaf0f4':'#ffffff',showAreaLabel:true,showSurfaceArea:!!cur.instel.m2,customName:r.naam,name:r.naam}));
  const lines=[];const ln=(a,b,type='solid_line')=>lines.push({a:P(a),b:P(b),type,color:'#555555',thickness:1});
  v.els.forEach(e=>{const Pp=elPoly(e);if(e.soort==='trap'){for(let i=0;i<4;i++)ln(Pp[i],Pp[(i+1)%4]);const n=Math.max(2,Math.round(num(e.treden)||14)),b=num(e.b)||0,d=num(e.d)||0;for(let i=1;i<n;i++){const y=d*i/n;ln(add(rot([0,y],e.rot||0),[+e.x,+e.y]),add(rot([b,y],e.rot||0),[+e.x,+e.y]))}}
   else if(e.soort==='vide'){for(let i=0;i<4;i++)ln(Pp[i],Pp[(i+1)%4],'dashed_line');ln(Pp[0],Pp[2],'dashed_line');ln(Pp[1],Pp[3],'dashed_line')}else{for(let i=0;i<4;i++)ln(Pp[i],Pp[(i+1)%4])}});
  R.forEach(({r,g})=>g.E.forEach((e,i)=>{const lw=num(r.w[i]?.laag);if(lw)ln(add(e.a,mul(e.n,-lw)),add(e.b,mul(e.n,-lw)),'dashed_line')}));
  const labels=v.els.filter(e=>e.soort==='vide'&&e.label).map(e=>{const c=labelPt(elPoly(e));return{x:cm(c[0]),y:cm(c[1]),text:e.label,fontFamily:'Arial',fontSize:12,letterSpacing:0,fontColor:'#555555',backgroundColor:'#ffffff',backgroundAlpha:0,align:'center',rotation:0}});
  return{id:fi+1,name:v.naam,level:(+v.laag||1)-1,height:H,designs:[{id:100+fi,name:v.naam,walls,areas,surfaces:[],dimensions:[],items:[],labels,lines}],cameras:[]}});
 return{id:1,name:cur.adres?.naam||'Plattegrond',public:false,floors}}
// zijde(n) van andere ruimtes tegenover deze wand (zelfde wand, andere kant) – neemt 'dragend' over
function overkant(r,i){const g=geo(syncW(r)),e=g.E[i],t=wt(r.w[i]),out=[];V().ruimtes.forEach(o=>{if(o===r)return;const go=geo(syncW(o));go.E.forEach((f,j)=>{if(e.u[0]*f.u[0]+e.u[1]*f.u[1]>-.999)return;
 const d=(f.a[0]-e.a[0])*e.n[0]+(f.a[1]-e.a[1])*e.n[1];if(d<.01||Math.abs(d-Math.max(t,wt(o.w[j])))>.04)return;const pr=q=>(q[0]-e.a[0])*e.u[0]+(q[1]-e.a[1])*e.u[1];
 if(Math.min(e.L,Math.max(pr(f.a),pr(f.b)))-Math.max(0,Math.min(pr(f.a),pr(f.b)))<.05)return;o.w[j].dragend=r.w[i].dragend;out.push([o,j])})});return out}
function minIv(iv,a,b){const out=[];iv.forEach(([x,y])=>{if(b<=x||a>=y){out.push([x,y]);return}if(a>x)out.push([x,a]);if(b<y)out.push([b,y])});return out.filter(([x,y])=>y-x>.02)}
function downloadFML(){const j=maakFML();const blob=new Blob([JSON.stringify(j)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=bestandsnaam()+'.fml';document.body.appendChild(a);a.click();a.remove();
 toast(store.instel.fmlDeur?'FML-bestand gedownload':'FML gedownload (deuren/ramen als gat; stel de refids in voor echte deuren)')}
