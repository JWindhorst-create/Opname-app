<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>Bouwkundige keuring · NTA 8060</title>
<style>
:root{
  --bg:#f3f5f4; --card:#fff; --ink:#1e1e1e; --muted:#6E6E6E; --line:#DCE8E0;
  --brand:#2D6042; --brand2:#2D6042; --accent:#E3F1E7; --gh:#C8E4D0;
  --c1:#1e7b3a; --c2:#4caf50; --c3:#a4c639; --c4:#f2a33a; --c5:#e2522f; --c6:#a3201b; --c8:#2f6db5; --c9:#8a929e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:72px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600;letter-spacing:.2px}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);color:var(--ink);display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brand)}
header.top h1 small{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--muted);font-weight:600;text-transform:uppercase}
header.top button,header.top a.hb{background:var(--gh);color:#1e1e1e;border:0;border-radius:8px;padding:7px 11px;text-decoration:none;font-size:14px}
header.top img{height:44px;width:auto}
main{max-width:860px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{font-size:15px;margin:0 0 6px;color:var(--brand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid .full{grid-column:1/-1}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--brand2);color:#fff;font-weight:600}
.btn.sec{background:var(--accent);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand2);padding:6px 8px}
.btn.danger{background:#fbe9e7;color:#b3261e}
.btn.big{width:100%;padding:14px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand2);font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:7px;color:#fff;font-weight:700;font-size:14px;padding:0 6px}
.cb1{background:var(--c1)}.cb2{background:var(--c2)}.cb3{background:var(--c3)}.cb4{background:var(--c4)}.cb5{background:var(--c5)}.cb6{background:var(--c6)}.cb8{background:var(--c8)}.cb9{background:var(--c9)}.cb0{background:#ccd1d8}
.cond-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cond-pick button{border:2px solid transparent;border-radius:9px;padding:8px 0 6px;color:#fff;font-weight:700;line-height:1.1}
.cond-pick button small{display:block;font-size:9.5px;font-weight:500;opacity:.95}
.cond-pick button.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px 4px;font-size:13.5px}
.seg button.on{background:var(--brand2);color:#fff;font-weight:600}
.group-h{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 2px 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:14px}
.chip.has{border-color:var(--brand2);background:var(--accent);color:var(--brand)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos .ph{position:relative;width:92px;height:92px;border-radius:9px;overflow:hidden;background:#ddd}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.addph{width:92px;height:92px;border:2px dashed var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:#fafbfc}
.mic{border:0;background:var(--accent);color:var(--brand);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:600;float:right;margin-top:-26px}
.mic.rec{background:#e2522f;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 30px}
.sheet .sh-h{position:sticky;top:0;background:var(--brand);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .sh-h b{flex:1}
.sheet .sh-h button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:7px 12px}
.sheet .sh-b{padding:14px}
.suggest{position:relative}
.suggest ul{position:absolute;left:0;right:0;top:100%;z-index:10;list-style:none;margin:2px 0 0;padding:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:260px;overflow:auto}
.suggest li{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.suggest li:hover{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.att-row{padding:10px 0;border-bottom:1px solid var(--line)}
.att-row:last-child{border:0}
.att-row .seg button{font-size:12.5px;padding:8px 2px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi div{background:var(--accent);border-radius:11px;padding:10px 12px}
.kpi b{display:block;font-size:19px;color:var(--brand)}
.kpi span{font-size:12px;color:var(--muted)}
.preview-wrap{background:#c9ced6;border-radius:12px;padding:12px;overflow:auto;max-height:70vh}
.preview-wrap .rpt{transform-origin:top left}

/* ============ RAPPORT (huisstijl briefpapier dashboard) ============ */
.rpt{--g:#2D6042;--gh:#C8E4D0;--g1:#E3F1E7;--g0:#F6FAF7;--ln:#DCE8E0;--mu:#6E6E6E;font:9.3pt/1.5 "Segoe UI",Arial,Helvetica,sans-serif;color:#1e1e1e;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rpt .pg{width:210mm;height:296.8mm;position:relative;overflow:hidden;background:#fff;margin:0 0 10px}
.rpt .bp-wm{position:absolute;left:0;bottom:0;width:210mm;z-index:0}
.rpt .bp-logo{position:absolute;top:15.9mm;right:12mm;width:24.8mm;z-index:1}
.rpt .ph{position:absolute;top:19mm;left:16mm;right:48mm;z-index:1}
.rpt .ph .t1{font-size:7.3pt;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu)}
.rpt .ph .t2{font-size:14pt;font-weight:700;color:var(--g);margin-top:.6mm;line-height:1.2}
.rpt .ph .t3{font-size:8.3pt;color:var(--mu);margin-top:.6mm}
.rpt .pc{position:absolute;top:50mm;left:16mm;right:16mm;z-index:1}
.rpt .pf{position:absolute;bottom:9mm;left:16mm;right:16mm;display:flex;justify-content:space-between;font-size:7.5pt;color:var(--mu);border-top:.4pt solid var(--ln);padding-top:2mm;z-index:1}
.rpt .wmk{position:absolute;top:44%;left:0;right:0;text-align:center;font-size:84pt;font-weight:800;letter-spacing:10px;color:rgba(45,96,66,.06);transform:rotate(-30deg);z-index:2;pointer-events:none}
.rpt .blk{display:flow-root;margin-bottom:4mm}
.rpt .ico{display:inline-flex;align-items:center;justify-content:center;background:var(--gh);color:var(--g);border-radius:2mm;flex:none}
.rpt .ico svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rpt h2{display:flex;align-items:center;gap:3.5mm;font-size:15pt;font-weight:700;color:var(--g);margin:0;padding-bottom:2.5mm;border-bottom:.8pt solid var(--g)}
.rpt h2 .no{font-size:9pt;color:var(--mu);font-weight:600;letter-spacing:1px}
.rpt h3{display:flex;align-items:center;gap:2.5mm;font-size:10.5pt;color:var(--g);margin:0 0 2.5mm;font-weight:700}
.rpt p{margin:0 0 2mm}
.rpt .note{font-size:8pt;color:var(--mu)}
.rpt table{width:100%;border-collapse:collapse;font-size:8.8pt;background:rgba(255,255,255,.85)}
.rpt th{background:var(--gh);color:#1e1e1e;text-align:left;padding:2mm 2.5mm;font-weight:700;font-size:8.3pt}
.rpt td{padding:2mm 2.5mm;border-bottom:.4pt solid var(--ln);vertical-align:top}
.rpt tr.tot td{font-weight:700;background:var(--g1);border-bottom:0}
.rpt .r{text-align:right;white-space:nowrap}
.rpt .dl{display:grid;grid-template-columns:1fr 1fr;gap:0 9mm}
.rpt .dl div{display:grid;grid-template-columns:38mm 1fr;gap:3mm;padding:1.7mm 0;border-bottom:.4pt solid var(--ln)}
.rpt .dl span{color:var(--mu)}
.rpt .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.rpt .kpis>div{background:var(--g0);border:.4pt solid var(--ln);border-radius:1.6mm;padding:2.8mm 3.2mm}
.rpt .kpis span{display:block;font-size:7.4pt;color:var(--mu)}
.rpt .kpis b{font-size:13.5pt;font-weight:700;color:#1e1e1e}
.rpt .kpis .hl{background:var(--g);border-color:var(--g)}.rpt .kpis .hl span{color:rgba(255,255,255,.8)}.rpt .kpis .hl b{color:#fff}
.rpt .profile{display:flex;height:6mm;border-radius:1mm;overflow:hidden;background:var(--g0)}
.rpt .profile div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:7.5pt;font-weight:700}
.rpt .pleg{display:flex;flex-wrap:wrap;gap:1.5mm 5mm;margin-top:2mm;font-size:7.8pt;color:var(--mu)}
.rpt .pleg i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.6mm;margin-right:1.3mm;vertical-align:-.3mm}
.rpt .bar{height:2.2mm;background:var(--g);border-radius:.6mm}
.rpt .dots{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm}
.rpt .dots div{display:flex;align-items:center;gap:2.5mm;padding:1.6mm 0;border-bottom:.4pt solid var(--ln);font-size:8.6pt}
.rpt .dots div em{margin-left:auto;font-style:normal;color:var(--mu);font-size:7.8pt;text-align:right}
.rpt .dot{width:2.8mm;height:2.8mm;border-radius:50%;flex:none}
.rpt .d-ok{background:#2e8b4a}.rpt .d-let{background:#e9a23b}.rpt .d-no{background:#c8372d}.rpt .d-nt{background:#2f6db5}.rpt .d-nc{background:#c3c8d0}
.rpt .concl{background:var(--g0);border:.4pt solid var(--ln);border-left:1.4mm solid var(--g);padding:3.5mm 4.5mm;border-radius:0 1.6mm 1.6mm 0}
.rpt .concl h4{margin:0 0 1mm;font-size:9pt;color:var(--g)}
.rpt .badge{height:5.2mm;min-width:5.2mm;font-size:8pt;border-radius:1mm;padding:0 1.2mm}
.rpt .pill{display:inline-flex;align-items:center;border-radius:1mm;color:#fff;font-weight:600;font-size:8pt;padding:.7mm 2.3mm;white-space:nowrap}
.rpt .scale{display:grid;grid-template-columns:repeat(6,1fr);gap:1mm}
.rpt .scale div{color:#fff;padding:2.5mm 2mm;font-size:7.8pt;line-height:1.25}
.rpt .scale div b{display:block;font-size:13pt}
.rpt .scale div:first-child{border-radius:1mm 0 0 1mm}.rpt .scale div:last-child{border-radius:0 1mm 1mm 0}
.rpt .bv{background:#fff;border:.4pt solid var(--ln);border-left:1.4mm solid #c3c8d0;border-radius:0 1.6mm 1.6mm 0}
.rpt .bv .bh{display:flex;justify-content:space-between;align-items:center;gap:4mm;padding:2.6mm 4mm;background:var(--g0);border-bottom:.4pt solid var(--ln);border-radius:0 1.6mm 0 0}
.rpt .bv .bh .ref{font-size:7.3pt;color:var(--mu)}
.rpt .bv .bh b{font-size:10pt}
.rpt .bv .bb{display:grid;grid-template-columns:1fr 46mm;gap:5mm;padding:3mm 4mm}
.rpt .bv .txt div{margin-bottom:1.8mm}.rpt .bv .txt span{display:block;font-size:7.4pt;color:var(--g);font-weight:700}
.rpt .bv .cost{background:var(--g1);border-radius:1.2mm;padding:2.4mm 3mm;font-size:8.3pt;align-self:start}
.rpt .bv .cost div{display:flex;justify-content:space-between;gap:2mm;padding:.5mm 0}
.rpt .bv .cost .nhg{margin-top:1mm;font-size:7.3pt;font-weight:700;color:var(--g)}
.rpt .bv .bp{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm;padding:0 4mm 3.5mm}
.rpt .bv .bp figure{margin:0}.rpt .bv .bp img{width:100%;height:36mm;object-fit:cover;border-radius:1mm;display:block}
.rpt .bv .bp figcaption{font-size:6.8pt;color:var(--mu);margin-top:.7mm}
.rpt .toc a{display:flex;gap:4mm;align-items:center;padding:2.6mm 0;border-bottom:.4pt solid var(--ln);font-size:11pt;color:#1e1e1e;text-decoration:none}
.rpt .toc .no{font-weight:700;color:var(--mu);font-size:8.5pt;width:8mm}
.rpt .toc .pn{margin-left:auto;color:var(--mu);font-size:9.5pt}
.rpt .sign{display:grid;grid-template-columns:1fr 1fr;gap:12mm}
.rpt .sign .sigbox{height:20mm;display:flex;align-items:flex-end}
.rpt .sign .sigbox img{max-height:20mm;max-width:60mm}
.rpt .sign .sl{border-top:.6pt solid #1e1e1e;padding-top:2mm;font-size:8.6pt}
.rpt .status{display:inline-block;padding:.4mm 2mm;border-radius:1mm;font-size:7.5pt;font-weight:700;letter-spacing:.5px}
.rpt .status.concept{background:#fff1dc;color:#9a5a00}.rpt .status.def{background:var(--gh);color:var(--g)}
/* voorblad */
.rpt .cover .bp-logo{top:14mm;right:14mm;width:38mm}
.rpt .cv-head{position:absolute;top:22mm;left:16mm;right:62mm;z-index:1}
.rpt .cv-head .kick{font-size:8pt;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--mu)}
.rpt .cv-head h1{font-size:26pt;line-height:1.1;margin:4mm 0 2mm;color:var(--g);font-weight:700}
.rpt .cv-head .sub{font-size:11.5pt;color:#1e1e1e}
.rpt .cv-head .doel{display:inline-block;margin-top:4mm;background:var(--gh);color:var(--g);font-weight:700;font-size:9pt;padding:1.2mm 3.5mm;border-radius:1.2mm}
.rpt .cv-photo{position:absolute;top:76mm;left:16mm;right:16mm;height:92mm;border-radius:2mm;background:var(--g0) center/cover no-repeat;border:.4pt solid var(--ln);display:flex;align-items:center;justify-content:center;color:var(--g);z-index:1}
.rpt .cv-kpi{position:absolute;top:176mm;left:16mm;right:16mm;display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;z-index:1}
.rpt .cv-kpi>div{display:flex;gap:3mm;align-items:center;background:rgba(255,255,255,.92);border:.4pt solid var(--ln);border-radius:1.6mm;padding:3mm}
.rpt .cv-kpi span{display:block;font-size:7.4pt;color:var(--mu)}
.rpt .cv-kpi b{font-size:14pt}
.rpt .cv-meta{position:absolute;top:202mm;left:16mm;right:16mm;display:grid;grid-template-columns:repeat(3,1fr);gap:3mm 6mm;font-size:8.8pt;background:rgba(255,255,255,.92);padding:4mm 0;border-top:.8pt solid var(--g);z-index:1}
.rpt .cv-meta span{display:block;font-size:7.2pt;color:var(--mu)}
.rpt .cv-meta .status{display:inline-block;font-size:7.5pt}
.rpt .cv-co{position:absolute;bottom:12mm;left:16mm;right:16mm;font-size:8pt;color:#1e1e1e;z-index:1}
.rpt .cv-co b{color:var(--g)}

#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .rpt .pg{margin:0;break-after:page;page-break-after:always}
  .rpt .pg:last-child{break-after:auto;page-break-after:auto}
}
#hCamV{position:fixed;inset:0;z-index:6000;background:#000;display:flex;flex-direction:column}#hCamV[hidden]{display:none}#hCamV video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.hc-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;font-weight:600;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.hc-top button{background:rgba(0,0,0,.4);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 12px}
.hc-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#111;min-height:78px}.hc-th{position:relative;flex:0 0 auto}.hc-th img{width:62px;height:62px;object-fit:cover;border-radius:8px;display:block}
.hc-th button{position:absolute;top:3px;right:3px;border:0;border-radius:99px;padding:1px 7px;font-size:13px;background:rgba(255,255,255,.92);color:#b3261e}
.hc-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:#111;color:#fff}.hc-bar span{width:90px;font-size:14px}
#hcKlik{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #9aa8a0;padding:0;flex:0 0 auto;box-shadow:0 0 0 3px #fff inset}#hcKlik:active{transform:scale(.93)}
#hcKlaar{width:90px;flex:0 0 auto;background:#2D6042;color:#fff;border:0;border-radius:8px;padding:9px 0;font-weight:700}
.hc-flits{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.hc-flits.aan{animation:hcf .25s ease-out}@keyframes hcf{from{opacity:.75}to{opacity:0}}
.ui-ic{display:inline-block;vertical-align:-0.2em;flex:0 0 auto}.addph .ui-ic{margin-bottom:3px}.hb .ui-ic,#btnSettings .ui-ic{vertical-align:middle}.mic .ui-ic{vertical-align:-0.15em}.ui-n{display:inline-flex;align-items:center;gap:3px}
</style>

/* ---------- opslag (IndexedDB met fallback) ---------- */
const DB = (()=>{
  let dbp=null;
  function open(){ if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open('nta8060-keuring',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e)} });
    return dbp; }
  const mem={};
  return {
    async get(k){ try{const d=await open(); return await new Promise((res,rej)=>{const t=d.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error);});}catch(e){return mem[k]} },
    async set(k,v){ mem[k]=v; try{const d=await open(); await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error);});}catch(e){} },
    async del(k){ delete mem[k]; try{const d=await open(); await new Promise(res=>{const t=d.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=res;});}catch(e){} }
  };
})();

const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
function addMic(ta){
  if(!SR||ta._mic) return; ta._mic=1;
  const b=document.createElement('button'); b.type='button'; b.className='mic'; b.innerHTML=MIC_IC+' Inspreken';
  ta.parentNode.insertBefore(b,ta);
  let r=null;
  b.onclick=()=>{
    if(r){ r.stop(); return; }
    r=new SR(); r.lang='nl-NL'; r.continuous=true; r.interimResults=false;
    r.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal){ let t=e.results[i][0].transcript.trim(); t=t.charAt(0).toUpperCase()+t.slice(1); ta.value=(ta.value?ta.value.replace(/\s*$/,'')+(/[.!?]$/.test(ta.value.trim())?' ':'. '):'')+t; ta.dispatchEvent(new Event('input')); } } };
    r.onend=()=>{ r=null; b.classList.remove('rec'); b.innerHTML=MIC_IC+' Inspreken'; };
    r.onerror=()=>{ toast('Spraak niet beschikbaar'); };
    try{ r.start(); b.classList.add('rec'); b.innerHTML=STOP_IC+' Stop'; }catch(_){ r=null; }
  };
}

function pickPhoto(cb,gal){ const fi=$(gal?'#galIn':'#fileIn'); fi.onchange=async e=>{ const fs=[...e.target.files]; fi.value=''; for(const f of fs){ cb(await compress(f)); } }; fi.click(); }
function compress(file,max=1400,q=.78){ return new Promise(res=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ let {width:w,height:h}=img; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',q)); }; img.onerror=()=>res(null); img.src=u; }); }


/* ---------- serie-opname met eigen camera (doorklikken, pas aan het eind Klaar) ---------- */
let camStream=null,camC=null,camStart=0;
async function serieCamera(ctx){ /* ctx={naam, arr, klaar} */
  const terug=()=>pickPhoto(d=>{ if(d){ ctx.arr.push(d); save(); ctx.klaar(); } });
  const md=navigator.mediaDevices; if(!md||!md.getUserMedia) return terug();
  try{ camStream=await md.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false}); }
  catch(e){ toast('Camera niet beschikbaar – per foto opnemen'); return terug(); }
  camC=ctx; camStart=ctx.arr.length; let ov=$('#hCamV');
  if(!ov){ document.body.insertAdjacentHTML('beforeend','<div id="hCamV" hidden><video playsinline muted autoplay></video><div class="hc-flits"></div><div class="hc-top"><span id="hcNaam"></span><button type="button" id="hcAnn">✕</button></div><div class="hc-strip" id="hcStrip"></div><div class="hc-bar"><span id="hcN">0</span><button type="button" id="hcKlik" aria-label="Foto maken"></button><button type="button" id="hcKlaar">Klaar</button></div></div>'); ov=$('#hCamV');
    $('#hcKlik').onclick=camKlik; $('#hcKlaar').onclick=camStop; $('#hcAnn').onclick=camStop;
    $('#hcStrip').onclick=e=>{ const b=e.target.closest('[data-hcdel]'); if(!b) return; camC.arr.splice(+b.dataset.hcdel,1); save(); camStrip(); }; }
  ov.hidden=false; document.body.style.overflow='hidden'; $('#hcNaam').textContent=ctx.naam||'Foto-serie';
  const v=ov.querySelector('video'); v.srcObject=camStream; try{ await v.play(); }catch(e){} camStrip();
}
function camStrip(){ const n=camC.arr.length-camStart; $('#hcN').textContent=n+' foto'+(n===1?'':"'s");
  $('#hcStrip').innerHTML=camC.arr.slice(camStart).map((f,i)=>`<span class="hc-th"><img src="${f}" alt=""><button type="button" data-hcdel="${camStart+i}">✕</button></span>`).join(''); $('#hcStrip').scrollLeft=1e6; }
function camKlik(){ const v=$('#hCamV video'); if(!v||!v.videoWidth) return; const m=1400,k=Math.min(1,m/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*k); c.height=Math.round(v.videoHeight*k); c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const f=$('#hCamV .hc-flits'); f.classList.remove('aan'); void f.offsetWidth; f.classList.add('aan'); if(navigator.vibrate) navigator.vibrate(30);
  camC.arr.push(c.toDataURL('image/jpeg',.78)); save(); camStrip(); }
function camStop(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } const ov=$('#hCamV'); if(ov) ov.hidden=true; document.body.style.overflow='';
  if(!camC) return; const n=camC.arr.length-camStart; const c=camC; camC=null; c.klaar(); if(n>0) toast(n+' foto'+(n>1?"'s":'')+' toegevoegd'); }

function adresSuggest(){

async function pickAdres(id){
  const o=S.cur.obj; $('#adrUl').hidden=true; const msg=()=>$('#bagMsg');
  let d;
  try{ const r=await fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/lookup?id='+encodeURIComponent(id)); d=(await r.json()).response.docs[0]; }
  catch(_){ msg().textContent='Adres zoeken niet bereikbaar (geen internet?). Vul handmatig in.'; return; }
  o.adres=`${d.straatnaam} ${d.huis_nlt||d.huisnummer}`; o.postcode=d.postcode||''; o.plaats=d.woonplaatsnaam||'';
  save(); vObject(); $('#title').textContent=o.adres; msg().textContent='Adres overgenomen; gegevens ophalen uit de BAG en 3D BAG…';
  try{
    const m=/POINT\(([\d.]+) ([\d.]+)\)/.exec(d.centroide_rd||''); if(!m) throw new Error('geen coördinaten'); const x=+m[1],y=+m[2];
    const base='https://service.pdok.nl/lv/bag/wfs/v2_0?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:28992&bbox='+[x-1,y-1,x+1,y+1].join(',')+',EPSG:28992&typeNames=';
    const [vr,pr]=await Promise.all([fetch(base+'bag:verblijfsobject').then(r=>r.json()),fetch(base+'bag:pand').then(r=>r.json())]);
    const vbo=(vr.features||[]).find(f=>String(f.properties.identificatie)===String(d.adresseerbaarobject_id))||(vr.features||[])[0];
    const vp=vbo?.properties||{}; const pids=String(vp.pandidentificatie||'').split(/[,; ]+/);
    const pand=(pr.features||[]).find(f=>pids.includes(String(f.properties.identificatie)))||(pr.features||[])[0]; const pp=pand?.properties||{};
    const bag={vboId:vp.identificatie||d.adresseerbaarobject_id||'',pandId:pp.identificatie||'',bouwjaar:pp.bouwjaar??vp.bouwjaar??'',opp:vp.oppervlakte??'',doel:vp.gebruiksdoel||'',status:pp.status||vp.status||'',aantal:pp.aantal_verblijfsobjecten??''};
    if(bag.bouwjaar) o.bouwjaar=String(bag.bouwjaar); if(bag.opp) o.gbo=String(bag.opp);
    o.gebruiksdoel=String(bag.doel||''); o.bag=bag;
    // 3D BAG: bouwlagen, hoogte, daktype, inhoud
    let extra='';
    if(bag.pandId){ try{
      const j=await fetch('https://api.3dbag.nl/collections/pand/items/NL.IMBAG.Pand.'+bag.pandId).then(r=>r.json()); const objs=j.feature?.CityObjects||{}; let at=null;
      for(const k in objs){ const a=objs[k].attributes; if(a&&Object.keys(a).some(x=>/maaiveld/.test(x))){ at=a; break; } }
      if(at){ const mv=at.b3_h_maaiveld??at.h_maaiveld, top=at.b3_h_dak_max??at.h_dak_max; const lagen=at.b3_bouwlagen; const vol=at.b3_volume_lod22??at.b3_volume_lod12; const dt=String(at.b3_dak_type||'');
        if(lagen) o.bouwlagen=String(lagen);
        if(mv!=null&&top!=null) o.hoogte=(top-mv).toFixed(1).replace('.',',');
        if(vol&&(+bag.aantal||1)===1) o.inhoud=String(Math.round(vol));
        if(!o.dak&&/horizontal/.test(dt)) o.dak='Plat dak';
        extra=[lagen?lagen+' bouwlagen':'',o.hoogte?'hoogte '+o.hoogte+' m':'',vol&&(+bag.aantal||1)===1?'inhoud ± '+Math.round(vol)+' m³':''].filter(Boolean).join(', '); } }catch(_){ } }
    save(); vObject();
    const bv='https://bagviewer.kadaster.nl/lvbag/bag-viewer/?objectId='+encodeURIComponent(bag.vboId);
    msg().innerHTML=`BAG: bouwjaar ${esc(bag.bouwjaar||'?')}, ${esc(bag.opp||'?')} m², ${esc(bag.doel||'gebruiksdoel onbekend')}${bag.aantal>1?`, ${bag.aantal} verblijfsobjecten in het pand`:''}${extra?' · 3D BAG: '+esc(extra):''}. <a href="${bv}" target="_blank" rel="noopener">Bekijk in BAG-viewer</a>`
      +(+bag.aantal>1&&!/^Appartement|Maisonnette/.test(o.type||'')?'<br><b>Let op:</b> meerdere verblijfsobjecten in het pand – controleer het type woning (appartement?).':'');
  }catch(_){ msg().textContent='Adres overgenomen. BAG-gegevens niet bereikbaar – vul bouwjaar en oppervlakte handmatig in.'; }
}

/* ---------- KOSTEN ---------- */
function totals(k=S.cur){
  const per={}; let d=0,t=0,nv=0,nt=0,nhg=0;
  GROEPEN.forEach(g=>per[g.k]={d:0,t:0,nv:0,nt:0});
  k.bev.forEach(b=>{ const p=per[b.groep]; p.d+=num(b.direct); p.t+=num(b.termijn); p.nv+=num(b.ndVan); p.nt+=num(b.ndTot); if(b.nhg) nhg+=num(b.direct)+num(b.termijn); });
  Object.values(per).forEach(p=>{d+=p.d;t+=p.t;nv+=p.nv;nt+=p.nt;});
  const hw = num(k.herbouw.waarde) || num(k.obj.inhoud)*num(k.herbouw.m3prijs);
  const pct = hw? (d+t)/hw*100 : null;
  const cs=k.bev.filter(b=>b.cond>=1&&b.cond<=6).map(b=>+b.cond); const avg=cs.length?cs.reduce((a,b)=>a+b,0)/cs.length:null;
  return {per,d,t,nv,nt,nhg,hw,pct,avg,tot:d+t};
}

 camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'
};
const GIC={buiten:'home',onder:'layers',binnen:'door',nat:'drop',inst:'flame',div:'alert'};
const ico=(n,mm=8,s=.58)=>`<span class="ico" style="width:${mm}mm;height:${mm}mm"><svg viewBox="0 0 24 24" style="width:${mm*s}mm;height:${mm*s}mm">${IC[n]||''}</svg></span>`;
const appIco=(n,px=18)=>`<svg viewBox="0 0 24 24" width="${px}" height="${px}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px">${IC[n]||''}</svg>`;

/* ---------- rapport: secties → pagina's (briefpapier) ---------- */
const COLV={1:'var(--c1)',2:'var(--c2)',3:'var(--c3)',4:'var(--c4)',5:'var(--c5)',6:'var(--c6)',8:'var(--c8)',9:'var(--c9)'};
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
function refOf(b){ const gi=GROEPEN.findIndex(g=>g.k===b.groep)+1; const L=S.cur.bev.filter(x=>x.groep===b.groep); return `E${gi}.${L.indexOf(b)+1}`; }
function bpLogo(){ return S.settings.logo||ELN_BP.logo; }
function bpWm(){ return S.settings.geenBeeldmerk?'':(S.settings.beeldmerk||ELN_BP.wm); }

function buildSections(){
  const k=S.cur, o=k.obj, st=S.settings, T=totals(k), B=k.bev;
  const adres=[o.adres,[o.postcode,o.plaats].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const concept=(k.status||'concept')==='concept';
  const stLbl=Object.fromEntries(STATUS);
  const kv=(l,v)=>`<div><span>${l}</span><b style="font-weight:600">${v||'–'}</b></div>`;
  const S2=[];

  /* voorblad */
  S2.push({cover:true, html:`
    <div class="cv-head"><div class="kick">Bouwkundig rapport · NTA 8060</div>
      <h1>${esc(o.adres||'Adres object')}</h1><div class="sub">${esc([o.postcode,o.plaats].filter(Boolean).join('  '))}</div>
      <div class="sub" style="color:#6E6E6E;margin-top:1mm">${[o.type,o.bouwjaar?'bouwjaar '+o.bouwjaar:''].filter(Boolean).map(esc).join(' · ')}</div>
      <div class="doel">${esc(o.doel||'Bouwkundige keuring')}</div></div>
    <div class="cv-photo" style="${o.voorgevel?`background-image:url(${o.voorgevel})`:''}">${o.voorgevel?'':ico('camera',14)}</div>
    <div class="cv-kpi">
      <div>${ico('euro',10)}<div><span>Totale herstelkosten</span><b>${eur(T.tot)}</b></div></div>
      <div>${ico('gauge',10)}<div><span>Gemiddelde conditie</span><b>${T.avg?T.avg.toFixed(1)+' <small style="font-size:8.5pt;font-weight:400;color:#6E6E6E">'+COND[Math.round(T.avg)].l.toLowerCase()+'</small>':'–'}</b></div></div>
      <div>${ico('clip',10)}<div><span>Bevindingen</span><b>${B.length}${T.pct!=null?` <small style="font-size:8.5pt;font-weight:400;color:#6E6E6E">· staat ${T.pct.toFixed(1)}%</small>`:''}</b></div></div></div>
    <div class="cv-meta">
      <div><span>Rapportnummer</span>${esc(k.rapportnr)}</div><div><span>Versie / status</span>${esc(k.versie||'1.0')} <span class="status ${concept?'concept':'def'}">${concept?'CONCEPT':'DEFINITIEF'}</span></div><div><span>Inspectiedatum</span>${fmtDate(o.datum)}${o.tijd?', '+esc(o.tijd)+' uur':''}</div>
      <div><span>Opdrachtgever</span>${esc(o.opdrachtgever||'–')}</div><div><span>Bouwkundig inspecteur</span>${esc(o.inspecteur||'–')}</div><div><span>Registratienummer</span>${esc(o.registratie||'–')}</div></div>
    <div class="cv-co"><b>${esc(st.bedrijf||'')}</b>${st.adres?' · '+esc(st.adres):''}<br>${[st.tel,st.email,st.web,st.kvk?'KvK '+st.kvk:''].filter(Boolean).map(esc).join(' · ')}</div>`});

  const chapters=[['01','Samenvatting','clip'],['02','Opdracht en object','home'],['03','Kostenraming','euro'],['04','Conditiemeting en leeswijzer','gauge'],['05','Bevindingen','search'],['06','Uitgangspunten en ondertekening','pen']].concat(o.nhg==='ja'?[['B1','Bijlage: Bouwkundig rapport NHG','shield']]:[]);
  const CH=Object.fromEntries(chapters.map(c=>[c[0],c]));
  const sec=(no,blocks)=>({no,title:no?CH[no][1]:'Inhoud',icon:no?CH[no][2]:'list',blocks:[`<h2>${ico(no?CH[no][2]:'list',9)}${no?`<span class="no">${no}</span>`:''}${no?CH[no][1]:'Inhoud'}</h2>`,...blocks]});

  /* inhoud */
  S2.push(sec('',[`<div class="toc">${chapters.map(([a,t,i])=>`<a>${ico(i,7)}<span class="no">${a}</span>${t}<span class="pn">{{p:${a}}}</span></a>`).join('')}</div>`,
    `<h3 style="margin-top:6mm">${ico('info',6)}Documentgegevens</h3><div class="dl">
    ${kv('Rapportnummer',esc(k.rapportnr))}${kv('Versie / status',esc(k.versie||'1.0')+' · '+(concept?'Concept':'Definitief'))}
    ${kv('Inspectiedatum',fmtDate(o.datum))}${kv('Rapportagedatum',fmtDate(o.rapportdatum||o.datum))}
    ${kv('Bouwkundig inspecteur',esc(o.inspecteur))}${kv('Geautoriseerd door',esc(o.autorisatie))}
    ${kv('Methodiek','NTA 8060 · NEN 2767')}${kv('Opdrachtgever',esc(o.opdrachtgever))}</div>`,
    `<p class="note">Dit rapport is uitsluitend opgesteld voor de opdrachtgever en voor het doel dat in hoofdstuk 02 is vermeld. Niets uit dit rapport mag zonder toestemming van ${esc(st.bedrijf||'de opsteller')} worden verveelvoudigd of aan derden ter beschikking worden gesteld, met uitzondering van de geldverstrekker en NHG.</p>`]));

  /* 01 samenvatting */
  const cnt={}; [1,2,3,4,5,6,8,9].forEach(c=>cnt[c]=B.filter(b=>+b.cond===c).length); const nSc=Object.values(cnt).reduce((a,b)=>a+b,0);
  const grp=GROEPEN.map(g=>{ const L=B.filter(b=>b.groep===g.k); const sc=L.map(b=>+b.cond).filter(c=>c>=1&&c<=6); return {g,n:L.length,worst:sc.length?Math.max(...sc):(L.some(b=>+b.cond===8)?8:null),cost:T.per[g.k].d+T.per[g.k].t}; }).filter(x=>x.n);
  const maxC=Math.max(1,...grp.map(x=>x.cost));
  const top=[...B].filter(b=>+b.cond>=4||num(b.direct)).sort((a,b)=>(num(b.direct)+num(b.termijn))-(num(a.direct)+num(a.termijn))||(+b.cond)-(+a.cond)).slice(0,6);
  const pill=c=>c?`<span class="pill cb${c}">${c} · ${COND[c].l}</span>`:'–';
  S2.push(sec('01',[
    `<div class="kpis"><div class="hl"><span>Totaal herstel</span><b>${eur(T.tot)}</b></div><div><span>Direct</span><b>${eur(T.d)}</b></div><div><span>Op termijn</span><b>${eur(T.t)}</b></div><div><span>Nader te bepalen</span><b>${T.nt?eur(T.nv)+'–'+eur(T.nt).replace('€ ',''):'–'}</b></div></div>
     <div class="kpis" style="margin-top:3mm"><div><span>Gem. conditiescore</span><b>${T.avg?T.avg.toFixed(1):'–'}</b></div><div><span>Bouwtechnische staat</span><b>${T.pct!=null?T.pct.toFixed(1)+'%':'–'}</b></div><div><span>Bevindingen</span><b>${B.length}</b></div><div><span>NHG-kosten</span><b>${o.nhg==='ja'?eur(T.nhg):'n.v.t.'}</b></div></div>`,
    ...((k.conclusie||k.advies)?[`<div class="concl">${k.conclusie?`<h4>Conclusie</h4><p>${nl2br(k.conclusie)}</p>`:''}${k.advies?`<h4 style="margin-top:2.5mm">Advies</h4><p style="margin:0">${nl2br(k.advies)}</p>`:''}</div>`]:[]),
    ...(nSc?[`<h3>${ico('gauge',6)}Conditieprofiel</h3><div class="profile">${[1,2,3,4,5,6,8,9].filter(c=>cnt[c]).map(c=>`<div style="width:${cnt[c]/nSc*100}%;background:${COLV[c]}">${cnt[c]}</div>`).join('')}</div>
      <div class="pleg">${[1,2,3,4,5,6,8,9].filter(c=>cnt[c]).map(c=>`<span><i style="background:${COLV[c]}"></i>${c} ${COND[c].l} (${cnt[c]})</span>`).join('')}</div>`]:[]),
    ...(grp.length?[`<h3>${ico('layers',6)}Per hoofdgroep</h3><table><tr><th>Hoofdgroep</th><th class="r">Aantal</th><th>Slechtste conditie</th><th class="r">Herstelkosten</th><th style="width:34mm"></th></tr>
      ${grp.map(x=>`<tr><td>${x.g.t}</td><td class="r">${x.n}</td><td>${pill(x.worst)}</td><td class="r">${eur(x.cost)}</td><td style="vertical-align:middle">${x.cost?`<div class="bar" style="width:${x.cost/maxC*100}%"></div>`:''}</td></tr>`).join('')}</table>`]:[]),
    ...(top.length?[`<h3>${ico('alert',6)}Belangrijkste aandachtspunten</h3><table><tr><th style="width:12mm">Ref.</th><th>Element</th><th>Locatie</th><th>Conditie</th><th class="r">Kosten</th></tr>
      ${top.map(b=>`<tr><td>${refOf(b)}</td><td>${esc(b.element)}</td><td>${esc(b.locatie||'–')}</td><td>${pill(b.cond)}</td><td class="r">${eur(num(b.direct)+num(b.termijn))}</td></tr>`).join('')}</table>`]:[])
  ]));

  /* 02 opdracht en object */
  S2.push(sec('02',[
    `<h3>${ico('clip',6)}A · Opdracht</h3><div class="dl">
      ${kv('Soort keuring',esc(o.doel))}${kv('Inspectiedatum',fmtDate(o.datum)+(o.tijd?', '+esc(o.tijd)+' uur':''))}
      ${kv('Opdrachtgever',esc(o.opdrachtgever))}${kv('Adres opdrachtgever',esc(o.ogAdres))}
      ${kv('Telefoon',esc(o.ogTel))}${kv('E-mail',esc(o.ogMail))}
      ${kv('Aanwezig bij keuring',esc(o.aanwezig))}${kv('Bouwkundig inspecteur',esc(o.inspecteur)+(o.registratie?' ('+esc(o.registratie)+')':''))}</div>`,
    `<h3>${ico('home',6)}B · Object</h3><div class="dl">
      ${kv('Adres',esc(o.adres))}${kv('Postcode en plaats',esc([o.postcode,o.plaats].filter(Boolean).join(' ')))}
      ${kv('Type woning',esc(o.type))}${kv('Bouwjaar',esc(o.bouwjaar))}
      ${kv('Gebruiksoppervlakte',o.gbo?esc(o.gbo)+' m²':'')}${kv('Inhoud',o.inhoud?esc(o.inhoud)+' m³':'')}
      ${kv('Aantal bouwlagen',esc(o.bouwlagen))}${kv('Hoogte gebouw',o.hoogte?esc(o.hoogte)+' m':'')}${kv('Gebruiksdoel (BAG)',esc(o.gebruiksdoel||''))}${kv('Dakvorm',esc(o.dak))}
      ${kv('Funderingswijze',esc(o.fundering||'Onbekend'))}${kv('Energielabel',esc(o.label))}
      ${kv('Verwarming',esc(o.verwarming))}${kv('Ketel (bouwjaar / merk)',esc(o.ketel))}
      ${kv('Bewoning',esc(o.bewoning))}${kv('Weersomstandigheden',esc(o.weer))}</div>`,
    `<h3>${ico('alert',6)}C · Bijzondere aandachtspunten</h3>
    <div class="dots">${AANDACHT.map(([kk,t])=>{const a=k.aandacht[kk]||{s:'nc'}; return `<div><span class="dot d-${a.s}"></span>${t}<em>${stLbl[a.s]}${a.t?' – '+esc(a.t):''}</em></div>`}).join('')}</div>
    <div class="pleg" style="margin-top:2.5mm">${STATUS.map(([v,l])=>`<span><i class="d-${v}" style="border-radius:50%"></i>${l}</span>`).join('')}</div>`
  ]));

  /* 03 kosten */
  const nader=B.filter(b=>+b.cond===8||num(b.ndTot));
  S2.push(sec('03',[
    `<table><tr><th>Hoofdgroep</th><th class="r">Direct</th><th class="r">Op termijn</th><th class="r">Totaal</th><th class="r">Nader te bepalen</th></tr>
    ${GROEPEN.map(g=>{const p=T.per[g.k]; return `<tr><td>${g.t}</td><td class="r">${eur(p.d)}</td><td class="r">${eur(p.t)}</td><td class="r">${eur(p.d+p.t)}</td><td class="r">${p.nt?eur(p.nv)+' – '+eur(p.nt):'–'}</td></tr>`}).join('')}
    <tr class="tot"><td>Totaal</td><td class="r">${eur(T.d)}</td><td class="r">${eur(T.t)}</td><td class="r">${eur(T.tot)}</td><td class="r">${T.nt?eur(T.nv)+' – '+eur(T.nt):'–'}</td></tr></table>
    <p class="note" style="margin-top:2.5mm"><b>Direct</b> – herstel is direct of op korte termijn nodig om (gevolg)schade te voorkomen. <b>Op termijn</b> – herstel binnen enkele jaren. <b>Nader te bepalen</b> – bandbreedte, afhankelijk van vervolgonderzoek. Alle bedragen zijn indicatief en inclusief btw.</p>`,
    ...(o.nhg==='ja'?[`<h3>${ico('shield',6)}Nationale Hypotheek Garantie</h3><div class="dl">${kv('Mee te nemen herstelkosten (NHG)','<b>'+eur(T.nhg)+'</b>')}${kv('Specificatie','Bijlage B1 – Bouwkundig rapport NHG')}</div>`]:[]),
    ...(nader.length?[`<h3>${ico('search',6)}Nader onderzoek aanbevolen</h3><table><tr><th style="width:12mm">Ref.</th><th>Element</th><th>Reden</th><th class="r">Indicatie</th></tr>
      ${nader.map(b=>`<tr><td>${refOf(b)}</td><td>${esc(b.element)}</td><td>${esc(b.gebrek||'')}</td><td class="r">${num(b.ndTot)?eur(b.ndVan)+' – '+eur(b.ndTot):'n.t.b.'}</td></tr>`).join('')}</table>`]:[]),
    `<h3>${ico('gauge',6)}Kengetallen</h3><div class="dl">${kv('Gemiddelde conditiescore (1–6)',T.avg?T.avg.toFixed(1):'')}${kv('Herbouwwaarde (indicatief)',T.hw?eur(T.hw):'')}
      ${kv('Bouwtechnische staat',T.pct!=null?T.pct.toFixed(1)+'%':'')}${kv('Berekening','herstelkosten / herbouwwaarde')}</div>`
  ]));

  /* 04 leeswijzer */
  S2.push(sec('04',[
    `<p>De conditie van de bouwdelen is beoordeeld met de zesdelige conditieschaal uit NEN 2767, zoals toegepast in de NTA 8060-methodiek voor bouwkundige keuringen van woningen. Per bevinding zijn locatie, conditie, ernst, hersteladvies en kostenraming vastgelegd. Elke bevinding heeft een referentie (bijv. E1.2) waarnaar in de kostenoverzichten wordt verwezen.</p>`,
    `<div class="scale">${[1,2,3,4,5,6].map(c=>`<div style="background:${COLV[c]}"><b>${c}</b>${COND[c].l}</div>`).join('')}</div>`,
    `<table><tr><th style="width:14mm">Score</th><th style="width:36mm">Conditie</th><th>Omschrijving</th></tr>${[1,2,3,4,5,6,8,9].map(c=>`<tr><td><span class="badge cb${c}">${c}</span></td><td>${COND[c].l}</td><td>${COND[c].d}</td></tr>`).join('')}</table>`,
    `<h3>${ico('alert',6)}Ernst van gebreken</h3><table><tr><th style="width:36mm">Ernst</th><th>Betekenis</th></tr><tr><td><b>Gering</b></td><td>Geen directe invloed op het functioneren van het bouwdeel.</td></tr><tr><td><b>Serieus</b></td><td>Het functioneren van het bouwdeel komt in gevaar.</td></tr><tr><td><b>Ernstig</b></td><td>Het functioneren van het bouwdeel is (deels) aangetast.</td></tr></table>`
  ]));

  /* 05 bevindingen */
  const bvBlocks=[];
  GROEPEN.forEach(g=>{ const L=B.filter(b=>b.groep===g.k); if(!L.length) return;
    L.forEach((b,i)=>{ const r=refOf(b), c=b.cond; const hasCost=num(b.direct)||num(b.termijn)||num(b.ndTot)||b.nhg;
      const card=`<div class="bv" style="border-left-color:${c?COLV[c]:'#c3c8d0'}">
      <div class="bh"><div><div class="ref">${r}${b.locatie?' · '+esc(b.locatie):''}</div><b>${esc(b.element)}</b></div>${c?pill(c):'<span class="note">Niet beoordeeld</span>'}</div>
      <div class="bb" style="${hasCost?'':'grid-template-columns:1fr'}"><div class="txt">
        ${b.gebrek?`<div><span>Bevinding</span>${nl2br(b.gebrek)}</div>`:''}
        ${b.advies?`<div><span>Hersteladvies</span>${nl2br(b.advies)}</div>`:''}
        ${b.ernst?`<div><span>Ernst</span>${esc(b.ernst.charAt(0).toUpperCase()+b.ernst.slice(1))}</div>`:''}
        ${!b.gebrek&&!b.advies&&!b.ernst?'<div class="note">Geen bijzonderheden.</div>':''}</div>
        ${hasCost?`<div class="cost">${num(b.direct)?`<div><span>Direct</span><b>${eur(b.direct)}</b></div>`:''}${num(b.termijn)?`<div><span>Op termijn</span><b>${eur(b.termijn)}</b></div>`:''}${num(b.ndTot)?`<div><span>Nader te bep.</span><b>${eur(b.ndVan)}–${eur(b.ndTot).replace('€ ','')}</b></div>`:''}${b.nhg?'<div class="nhg">✓ Meegenomen in NHG</div>':''}</div>`:''}
      </div>
      ${b.fotos?.length?`<div class="bp">${b.fotos.map((f,j)=>`<figure><img src="${f}"><figcaption>Foto ${r}.${j+1}</figcaption></figure>`).join('')}</div>`:''}</div>`;
      bvBlocks.push((i===0?`<h3>${ico(GIC[g.k],6)}${g.t}</h3>`:'')+card); });
  });
  S2.push(sec('05',[...(bvBlocks.length?bvBlocks:['<p class="note">Geen bevindingen vastgelegd.</p>']),
    ...(k.beperkt?[`<h3>${ico('info',6)}Beperkt of niet waarneembaar</h3><p>${nl2br(k.beperkt)}</p>`]:[])]));

  /* 06 uitgangspunten en ondertekening */
  const signBlk=`<div class="sign"><div><div class="sigbox">${st.handtekening?`<img src="${st.handtekening}">`:''}</div><div class="sl"><b>${esc(o.inspecteur||'Bouwkundig inspecteur')}</b><br><span class="note">Bouwkundig inspecteur${o.registratie?' · reg. '+esc(o.registratie):''}<br>${esc(st.bedrijf||'')}</span></div></div>
      <div><div class="sigbox"></div><div class="sl"><b>Rapport ${esc(k.rapportnr)}</b><br><span class="note">Versie ${esc(k.versie||'1.0')} · ${concept?'Concept':'Definitief'}${o.autorisatie?'<br>Geautoriseerd door '+esc(o.autorisatie):''}</span></div></div></div>`;
  S2.push(sec('06',[
    `<h3>${ico('info',6)}Uitgangspunten</h3><p>${nl2br(st.disclaimer||'')}</p>`,
    `<h3>${ico('search',6)}Onderzoeksplicht en mededelingsplicht</h3><p>Een koper heeft een onderzoeksplicht en een verkoper een mededelingsplicht. Dit rapport legt de bouwkundige staat vast op de inspectiedatum, maar vervangt geen specialistisch onderzoek zoals fundering-, asbest-, elektra- of houtaantastingsonderzoek.</p>`,
    `<h3>${ico('pen',6)}Ondertekening</h3><p>Aldus naar waarheid opgemaakt${st.plaats?' te '+esc(st.plaats):''} op ${fmtDate(o.rapportdatum||o.datum)}.</p>${signBlk}`]));

  /* B1 NHG */
  if(o.nhg==='ja'){
    const rows=NHG_GROEPEN.map((g,i)=>{ const L=B.filter(b=>b.nhg&&nhgGroep(b)===i); return {g,L,sum:L.reduce((a,b)=>a+num(b.direct)+num(b.termijn),0)}; });
    S2.push(sec('B1',[
      `<p>In deze bijlage zijn de herstelkosten samengevat die volgens de inspecteur meetellen voor de aanvraag van Nationale Hypotheek Garantie, ingedeeld naar de hoofdgroepen van het NHG-rapport. Deze kosten kunnen afwijken van de totale kostenraming in hoofdstuk 03, omdat niet alle onderdelen voor NHG relevant zijn.</p>`,
      `<div class="dl">${kv('Object',esc(adres))}${kv('Rapportnummer',esc(k.rapportnr))}${kv('Inspectiedatum',fmtDate(o.datum))}${kv('Inspecteur',esc(o.inspecteur)+(o.registratie?' ('+esc(o.registratie)+')':''))}</div>`,
      `<table><tr><th style="width:8mm">#</th><th>Hoofdgroep NHG</th><th>Gebreken / herstel</th><th class="r">Kosten</th></tr>
      ${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b style="font-weight:600">${r.g}</b></td><td>${r.L.length?r.L.map(b=>`${refOf(b)} ${esc(b.element)}${b.locatie?' ('+esc(b.locatie)+')':''}${b.advies?' – '+esc(b.advies):''}`).join('<br>'):'<span class="note">Geen kosten van belang</span>'}</td><td class="r">${eur(r.sum)}</td></tr>`).join('')}
      <tr class="tot"><td></td><td colspan="2">Totaal mee te nemen herstelkosten t.b.v. NHG (incl. btw)</td><td class="r">${eur(T.nhg)}</td></tr></table>`,
      `<div class="sign"><div><div class="sigbox">${st.handtekening?`<img src="${st.handtekening}">`:''}</div><div class="sl"><b>${esc(o.inspecteur||'Bouwkundig inspecteur')}</b><br><span class="note">${fmtDate(o.rapportdatum||o.datum)}</span></div></div><div></div></div>
       <p class="note" style="margin-top:4mm">De voorwaarden en het programma van eisen van NHG (Stichting Waarborgfonds Eigen Woningen) zijn leidend; raadpleeg de actuele normen op nhg.nl.</p>`]));
  }
  return S2;
}

const mmPx=mm=>mm*96/25.4;
async function renderPages(){
  const k=S.cur,o=k.obj,st=S.settings; const secs=buildSections();
  try{ if(document.fonts) await document.fonts.ready; }catch(_){}
  const meas=document.createElement('div'); meas.className='rpt'; meas.style.cssText='position:absolute;left:-10000px;top:0;visibility:hidden;width:178mm'; document.body.appendChild(meas);
  const AREA=mmPx(227);
  const pages=[], startOf={};
  for(const s of secs){
    if(s.cover){ pages.push({cover:true,html:s.html}); continue; }
    let cur={sec:s,blocks:[]}, used=0; pages.push(cur); startOf[s.no||'IN']=pages.length;
    for(const b of s.blocks){
      meas.innerHTML=`<div class="blk">${b}</div>`;
      const imgs=[...meas.querySelectorAll('img')]; await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
      const h=meas.firstChild.getBoundingClientRect().height+mmPx(4);
      if(used+h>AREA && cur.blocks.length){ cur={sec:s,blocks:[],cont:true}; pages.push(cur); used=0; }
      cur.blocks.push(b); used+=h;
    }
  }
  meas.remove();
  const N=pages.length, concept=(k.status||'concept')==='concept';
  const wm=bpWm(), logo=bpLogo(), adres=[o.adres,o.plaats].filter(Boolean).join(', ');
  const base=`${wm?`<img class="bp-wm" src="${wm}">`:''}<img class="bp-logo" src="${logo}">${concept?'<div class="wmk">CONCEPT</div>':''}`;
  return pages.map((p,i)=>{
    if(p.cover) return `<div class="pg cover">${base}${p.html}</div>`;
    const html=p.blocks.map(b=>`<div class="blk">${b}</div>`).join('').replace(/\{\{p:(\w+)\}\}/g,(_,a)=>startOf[a]||'');
    return `<div class="pg">${base}
      <div class="ph"><div class="t1">${esc(st.bedrijf?st.bedrijf+' · ':'')}Bouwkundig rapport NTA 8060</div><div class="t2">${esc(adres||'')}</div><div class="t3">${p.sec.no?esc(p.sec.no)+' · ':''}${esc(p.sec.title)}${p.cont?' (vervolg)':''}</div></div>
      <div class="pc">${html}</div>
      <div class="pf"><span>Rapport ${esc(k.rapportnr)} · versie ${esc(k.versie||'1.0')} · ${fmtDate(o.rapportdatum||o.datum)}</span><span>Pagina ${i+1} van ${N}</span></div></div>`;
  }).join('');
}

function vRapport(){
  $('#view').innerHTML=`
   <div class="card"><h2>Rapport</h2>
     <div class="grid" style="margin-bottom:12px"><div><label>Versie</label><input data-k="versie" placeholder="1.0"></div><div><label>Status</label><div class="seg" data-seg="status"><button data-v="concept">Concept</button><button data-v="definitief">Definitief</button></div></div></div>
     <button class="btn big" id="pdfBtn"><svg class="ui-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg> Rapport als PDF</button>
     <p class="muted" style="margin:8px 0 0">Kies in het afdrukvenster <b>Opslaan als PDF</b>, papier A4, marges <b>Geen</b> en zet <b>Achtergrondafbeeldingen</b> aan.</p>
     <div class="row" style="margin-top:10px"><button class="btn sec" id="expBtn">Opname exporteren (.json)</button></div>
   </div>
   <div class="preview-wrap" id="pw"><div class="rpt" id="rp"><p style="padding:20px">Rapport wordt opgemaakt…</p></div></div>`;
  bindInputs($('#view').querySelector('.card'),S.cur);
  const fit=()=>{ const pw=$('#pw'),rp=$('#rp'); if(!pw||!rp) return; rp.style.transform=''; rp.style.marginBottom=''; const s=Math.min(1,(pw.clientWidth-24)/rp.offsetWidth); rp.style.transform=`scale(${s})`; rp.style.transformOrigin='top left'; rp.style.marginBottom=`${-(1-s)*rp.offsetHeight}px`; };
  const draw=async()=>{ const h=await renderPages(); const rp=$('#rp'); if(!rp) return; rp.innerHTML=h; rp.style.width='210mm'; fit(); };
  draw(); window.onresize=fit;
  let t; $('#view').querySelector('[data-k="versie"]').addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(draw,400); });
  $('#view').querySelectorAll('[data-seg="status"] button').forEach(b=>b.addEventListener('click',()=>setTimeout(draw,50)));
  $('#pdfBtn').onclick=printReport;
  $('#expBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(S.cur)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${S.cur.rapportnr} ${S.cur.obj.adres||''}.json`.trim(); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
}
async function printReport(){
  const pa=$('#printArea'); pa.innerHTML=`<div class="rpt">${await renderPages()}</div>`;
  const old=document.title; document.title=`Bouwkundig rapport ${S.cur.obj.adres||''} ${S.cur.rapportnr}`.trim();
  const imgs=[...pa.querySelectorAll('img')];
  await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
  try{ window.print(); }catch(_){ toast('Afdrukken niet beschikbaar in deze weergave'); }
  setTimeout(()=>{ document.title=old; },1000);
}

/* ---------- INSTELLINGEN ---------- */
function settingsSheet(){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><div class="sh-h"><b>Instellingen rapport</b><button id="sOk">Gereed</button></div><div class="sh-b">
  <div class="card"><h2>Bedrijf</h2><div class="grid">
   ${F('bedrijf','Bedrijfsnaam','text','full')}${F('adres','Adres','text','full')}${F('tel','Telefoon','tel')}${F('email','E-mail','email')}${F('web','Website')}${F('kvk','KvK-nummer')}
   ${F('inspecteur','Standaard inspecteur')}${F('registratie','Registratienummer')}${F('plaats','Plaats ondertekening')}
   <div><label>Huiskleur</label><input type="color" data-k="kleur" style="height:44px;padding:4px"></div></div>
   <label>Logo rechtsboven (leeg = logo Energielabels Nederland)</label><div class="photos" id="lgPh"></div>
   <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" data-k="geenBeeldmerk" style="width:auto"> Beeldmerk onderaan het briefpapier weglaten</label>
   <label>Handtekening (afbeelding, liefst PNG met transparante achtergrond)</label><div class="photos" id="hdPh"></div></div>
  <div class="card"><h2>Standaardtekst algemene toelichting</h2>${TA('disclaimer','Disclaimer / uitgangspunten')}</div>
  </div></div>`;
  document.body.appendChild(bg); bindInputs(bg,S.settings);
  bg.querySelector('[data-k="kleur"]').addEventListener('input',applyColor);
  const lg=bg.querySelector('#lgPh'); const draw=()=>{ lg.innerHTML=(S.settings.logo?`<div class="ph" style="width:160px;background:#fff"><img src="${S.settings.logo}" style="object-fit:contain"><button id="lgDel">×</button></div>`:'')+`<button class="addph" id="lgAdd">＋<span>Logo</span></button>`;
    lg.querySelector('#lgAdd').onclick=()=>{ const fi=$('#fileIn'); fi.removeAttribute('capture'); fi.onchange=async e=>{ const f=e.target.files[0]; fi.value=''; fi.setAttribute('capture','environment'); if(!f) return; const r=new FileReader(); r.onload=()=>{ S.settings.logo=r.result; save(); draw(); }; r.readAsDataURL(f); }; fi.click(); };
    const d=lg.querySelector('#lgDel'); if(d) d.onclick=()=>{ S.settings.logo=''; save(); draw(); }; }; draw();
  const hd=bg.querySelector('#hdPh'); const drawH=()=>{ hd.innerHTML=(S.settings.handtekening?`<div class="ph" style="width:160px;background:#fff"><img src="${S.settings.handtekening}" style="object-fit:contain"><button id="hdDel">×</button></div>`:'')+`<button class="addph" id="hdAdd">＋<span>Handtekening</span></button>`;
    hd.querySelector('#hdAdd').onclick=()=>{ const fi=$('#fileIn'); fi.removeAttribute('capture'); fi.onchange=async e=>{ const f=e.target.files[0]; fi.value=''; fi.setAttribute('capture','environment'); if(!f) return; const r=new FileReader(); r.onload=()=>{ S.settings.handtekening=r.result; save(); drawH(); }; r.readAsDataURL(f); }; fi.click(); };
    const d=hd.querySelector('#hdDel'); if(d) d.onclick=()=>{ S.settings.handtekening=''; save(); drawH(); }; }; drawH();
  bg.querySelector('#sOk').onclick=()=>{ bg.remove(); save(); if(S.cur) shell(); };
}
function confirmBox(msg,yes){
  const bg=document.createElement('div'); bg.className='sheet-bg'; bg.style.alignItems='center';
  bg.innerHTML=`<div class="card" style="max-width:340px;margin:20px"><p style="margin:0 0 14px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn sec" id="cN">Annuleren</button><button class="btn danger" id="cY">Verwijderen</button></div></div>`;
  document.body.appendChild(bg); bg.querySelector('#cN').onclick=()=>bg.remove(); bg.querySelector('#cY').onclick=()=>{ bg.remove(); yes(); };
}
