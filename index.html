<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Opname Energielabel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#eceff0;--card:#f9fafa;--ink:#17201d;--muted:#5f6b67;--line:#d3d9d7;--acc:#1f6f5c;--acc2:#e1efea;--warn:#b5462e;--hi:#d4502f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:1000;background:var(--acc);color:#fff;padding:12px 16px calc(10px) ;padding-top:max(12px,env(safe-area-inset-top))}
header h1{font-size:17px;margin:0 0 8px}
.steps{display:flex;gap:4px;font-size:12px}
.steps span{flex:1;text-align:center;padding:4px 2px;border-radius:6px;background:rgba(255,255,255,.15);cursor:pointer}
.steps span.on{background:#fff;color:#1f6f5c;font-weight:600}
main{padding:16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font-size:16px;padding:11px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button.small{font-size:14px;padding:6px 10px}
button.del{border-color:var(--warn);color:var(--warn);background:transparent}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--muted);font-weight:500}
.res{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.res:active{background:var(--acc2)}
#map{height:58vh;border-radius:12px;border:1px solid var(--line)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);font-size:13px;margin:2px 4px 2px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{white-space:nowrap;background:var(--card);color:var(--ink);border-color:var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sec{margin-bottom:16px}.sechead{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--card)}
.item .item{background:var(--bg)}
.ihead{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.note{font-size:13px;color:var(--muted)}
.corr{font-size:13px;color:var(--acc);margin-top:4px}
.opp{font-size:13px;margin-top:6px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:1000}
.bar button{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:2000}
.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{flex:1 1 40%;background:var(--card);color:var(--ink);border-color:var(--line)}.choice button small{opacity:.75;font-size:12px}.choice button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}
#modal .box{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;max-width:420px;width:100%;white-space:pre-line}
#modal .row{margin-top:16px}
.sug{border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
.err{color:var(--warn);font-size:14px}
</style>
</head>
<body>
<header><h1 id="titel">Opname Energielabel</h1><div class="steps" id="steps"></div></header>
<main id="app"></main>
<div class="bar" id="bar"></div>
<div id="toast"></div>
<div id="modal"><div class="box"><div id="mtekst"></div><div class="row"><button class="ghost" id="mnee">Nee</button><button id="mja">Ja</button></div></div></div>
<script>
// ---------- opslag ----------
const KEY='opnameApp_v1';
let store=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{opnames:[]}}catch(e){return{opnames:[]}}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){toast('Opslaan lukte niet')}}
let cur=null, scherm='lijst', vIdx=0, zoekRes=[], map=null, vorig=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const f2=n=>n==null?'–':n.toFixed(2).replace('.',',');
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500)}

function vraag(tekst,ja='Ja',nee='Nee'){return new Promise(res=>{const m=$('#modal');$('#mtekst').textContent=tekst;$('#mja').textContent=ja;$('#mnee').textContent=nee;m.style.display='flex';
 const klaar=v=>{m.style.display='none';$('#mja').onclick=$('#mnee').onclick=null;res(v)};$('#mja').onclick=()=>klaar(true);$('#mnee').onclick=()=>klaar(false)})}
// ---------- definities ----------
const GLAS=['Onbekend','Enkel','Dubbel','HR','HR+','HR++','Triple'];
const KOZ=['Onbekend','Hout','Kunststof','Aluminium','Alu therm. onderbroken','Staal'];
const ISO=['Onbekend','Geen','Volgens bouwjaar','Matig (Rc ± 1)','Goed (Rc ± 2,5)','Zeer goed (Rc ≥ 3,5)'];
const N=(k,l,c,w)=>({k,l,t:'num',corr:!!c,when:w}), S=(k,l,o,w)=>({k,l,t:'sel',o,when:w}), X=(k,l)=>({k,l,t:'txt'}), O=(k,l,w)=>({k,l,t:'orient',when:w});
const INST_W=['Verwarming','Tapwater','Ventilatie','Koeling','Zonnepanelen (PV)','Zonneboiler','Overig'];
const INST_U=['Verwarming','Tapwater','Ventilatie','Luchtbehandeling','Koeling','Bevochtiging','Verlichting','Zonnepanelen (PV)','Zonneboiler','Overig'];
const IS=(...l)=>it=>l.includes(it.soort||'Verwarming');
const MG=it=>it.soort==='Met glas';
function glasOpp(it){if(it.type!=='deur'||!MG(it))return null;const d=num(it.gm2);if(d!=null)return d;const b=num(it.gb),h=num(it.gh);return b!=null&&h!=null?b*h:null}
const opts=f=>typeof f.o==='function'?f.o():f.o;
const zichtbaar=(it,f)=>!f.when||f.when(it);
const UFUNC=['Kantoorfunctie','Bijeenkomstfunctie','Celfunctie','Gezondheidszorgfunctie met bedgebied','Gezondheidszorgfunctie overig','Industriefunctie','Logiesfunctie','Onderwijsfunctie','Sportfunctie','Winkelfunctie','Overige gebruiksfunctie'];
const DEF={
 dakvlak:{t:'Dakvlak',f:[O('orient','Oriëntatie'),N('lengte','Lengte nok → goot (m)'),N('breedte','Breedte bouwmuur → bouwmuur (m)',1),N('helling','Hellingshoek (°)'),S('isolatie','Isolatie',ISO),N('rc','Rc indien bekend (m²K/W)'),S('bewijs','Bewijs',['Geen','Waarneming','Foto','Factuur','Bouwtekening / bestek']),X('opm','Opmerking')],opp:['lengte','breedte'],sub:['dakraam','dakkapel']},
 dakraam:{t:'Dakraam',f:[N('b','Breedte (m)'),N('h','Hoogte (m)'),N('aantal','Aantal'),N('m2','Of totaal direct (m²)'),S('glas','Glas',GLAS),S('kozijn','Kozijn',KOZ)],opp:['b','h','aantal']},
 dakkapel:{t:'Dakkapel',f:[N('b','Breedte (m)'),N('h','Hoogte voorzijde (m)'),N('d','Diepte (m)'),S('isolatie','Isolatie',ISO),N('rc','Rc indien bekend (m²K/W)'),S('bewijs','Bewijs',['Geen','Waarneming','Foto','Factuur','Bouwtekening / bestek']),X('opm','Opmerking')],sub:['raam']},
 gevel:{t:'Gevel',f:[O('orient','Oriëntatie'),N('breedte','Breedte bouwmuur → bouwmuur (m)',1),N('hoogte','Hoogte (m)'),S('isolatie','Isolatie',ISO),N('rc','Rc indien bekend (m²K/W)'),S('bewijs','Bewijs',['Geen','Waarneming','Foto','Factuur','Bouwtekening / bestek']),X('opm','Opmerking')],opp:['breedte','hoogte'],sub:['raam','deur']},
 raam:{t:'Raam',f:[N('b','Breedte (m)'),N('h','Hoogte (m)'),N('aantal','Aantal'),N('m2','Of totaal direct (m²)'),S('glas','Glas',GLAS),S('kozijn','Kozijn',KOZ)],opp:['b','h','aantal']},
 deur:{t:'Deur',f:[N('b','Breedte (m)'),N('h','Hoogte (m)'),N('m2','Of totaal direct (m²)'),S('soort','Soort',['Dicht','Met glas','Paneel']),N('gb','Glas breedte (m)',0,MG),N('gh','Glas hoogte (m)',0,MG),N('gm2','Of glas totaal direct (m²)',0,MG),S('glas','Glas',GLAS,MG)],opp:['b','h']},
 vloer:{t:'Vloer',f:[S('grenst','Grenst aan',['Kruipruimte','Grond','Buitenlucht','Onverwarmde ruimte']),N('lengte','Lengte (m)'),N('breedte','Breedte bouwmuur → bouwmuur (m)',1),S('isolatie','Isolatie',ISO),N('rc','Rc indien bekend (m²K/W)'),S('bewijs','Bewijs',['Geen','Waarneming','Foto','Factuur','Bouwtekening / bestek']),X('opm','Opmerking')],opp:['lengte','breedte']},
 installatie:{t:'Installatie',f:[
  S('soort','Soort',()=>cur?.type?.methode==='U'?INST_U:INST_W),
  S('collectief','Individueel / collectief',['Individueel','Collectief'],IS('Verwarming','Tapwater','Ventilatie','Koeling')),
  S('opwekker','Opwekker',['HR107-ketel','HR100 / VR-ketel','CR / conventionele ketel','Warmtepomp lucht/water','Warmtepomp bodem/water','Hybride warmtepomp','Externe warmtelevering (stadsverwarming)','Elektrische verwarming','Lokale verwarming (kachel)','Onbekend'],IS('Verwarming')),
  S('afgifte','Afgifte',['Radiatoren / convectoren','LT-radiatoren','Vloerverwarming','Wandverwarming','Luchtverwarming','Plafondpanelen / stralingspanelen','Onbekend'],IS('Verwarming')),
  S('toestel','Toestel',['Combiketel (cv + tapwater)','Gasboiler','Elektrische boiler','Geiser','Warmtepompboiler','Externe warmtelevering','Doorstroomtoestel elektrisch','Onbekend'],IS('Tapwater')),
  S('vsys','Ventilatiesysteem',['A · natuurlijke toe- en afvoer','B · mechanische toevoer','C · mechanische afvoer','D · gebalanceerd','E · decentraal','Onbekend'],IS('Ventilatie')),
  S('wtw','Warmteterugwinning',['Nee','Ja'],IS('Ventilatie','Luchtbehandeling')),
  S('dc','Gelijkstroomventilator',['Onbekend','Ja','Nee'],IS('Ventilatie')),
  S('ksys','Koelsysteem',['Compressiekoeling (split / airco)','Omkeerbare warmtepomp','Bodemkoeling','Externe koudelevering','Onbekend'],IS('Koeling')),
  N('panelen','Aantal panelen',0,IS('Zonnepanelen (PV)')),N('wp','Wp per paneel',0,IS('Zonnepanelen (PV)')),
  N('coll','Collectoroppervlak (m²)',0,IS('Zonneboiler')),
  O('orient','Oriëntatie',IS('Zonnepanelen (PV)','Zonneboiler')),N('helling','Hellingshoek (°)',0,IS('Zonnepanelen (PV)','Zonneboiler')),
  N('lw','Geïnstalleerd vermogen (W/m²)',0,IS('Verlichting')),
  S('lregel','Regeling',['Handmatig','Aanwezigheidsdetectie','Daglichtregeling','Aanwezigheid + daglicht','Onbekend'],IS('Verlichting')),
  S('bsys','Bevochtiging',['Stoom elektrisch','Stoom gas','Adiabatisch','Onbekend'],IS('Bevochtiging')),
  X('merk','Merk / type'),N('jaar','Bouwjaar toestel'),X('details','Details / opmerking')]}
};
const SECTIES=[['dakvlak','Dak'],['gevel','Gevels'],['vloer','Vloeren'],['installatie','Installaties']];

// ---------- helpers ----------
function norm(t){
 if(t.soort&&!t.wtype){t.wtype=t.soort==='appartement'?'appartement':(t.ligging||'tussen');delete t.soort;delete t.ligging}
 if(!t.methode){const gd=String(cur.bag?.gebruiksdoel||'woonfunctie').toLowerCase();t.methode=gd.includes('woonfunctie')?'W':'U'}
 t.wtype=t.wtype||'tussen';t.atype=t.atype||'galerij';t.alaag=t.alaag||'tussen';t.apos=t.apos||'tussen';t.belend=t.belend||'geen';
 if(!t.functies){const gd=String(cur.bag?.gebruiksdoel||'').toLowerCase().split(/[,;]\s*/).filter(x=>x&&x!=='woonfunctie');
  t.functies=gd.map(g=>({f:UFUNC.find(u=>u.toLowerCase().startsWith(g.replace('functie','')))||'Overige gebruiksfunctie',m2:gd.length===1?(cur.bag?.oppervlakte??''):''}));
  if(!t.functies.length)t.functies=[{f:'Kantoorfunctie',m2:''}]}
 if(t.lagen==null)t.lagen=2;if(t.zolder==null)t.zolder=t.methode==='W';return t}
function extraMaat(){const t=cur?.type;if(!t)return 0;
 if(t.methode==='U')return t.belend==='twee'?0.22:t.belend==='een'?0.11:0;
 const w=t.wtype;if(w==='tussen')return 0.22;if(w==='hoek'||w==='2onder1')return 0.11;if(w==='appartement')return t.apos==='hoek'?0.11:0.22;return 0}
function ligLabel(){const t=cur.type;if(t.methode==='U')return t.belend==='twee'?'Aan twee zijden belend':'Aan één zijde belend';
 return {tussen:'Tussenwoning',hoek:'Hoekwoning','2onder1':'2-onder-1-kap',appartement:'Appartement '+(t.apos==='hoek'?'(hoek)':'(tussen)')}[t.wtype]||''}
const val=(it,k)=>{const v=num(it[k]);return v==null?null:v+(it[k+'_x']||0)};
function opp(it){const d=DEF[it.type];if(!d.opp)return null;if(num(it.m2)!=null)return num(it.m2);let p=1;for(const k of d.opp){let v=val(it,k);if(k==='aantal')v=v??1;if(v==null)return null;p*=v}return p}
function zoek(id,lijst){for(const it of lijst){if(it.id===id)return{it,lijst};const r=zoek(id,it.subs||[]);if(r)return r}return null}
function vind(id){for(const v of cur.verdiepingen){const r=zoek(id,v.items);if(r)return r}return null}
const SECT=['N','NO','O','ZO','Z','ZW','W','NW'];
const sector=az=>SECT[Math.round(((az%360)+360)%360/45)%8];
function rd2wgs(x,y){const dX=(x-155000)*1e-5,dY=(y-463000)*1e-5;
 const n=3235.65389*dY-32.58297*dX*dX-0.2475*dY*dY-0.84978*dX*dX*dY-0.0655*dY**3-0.01709*dX*dX*dY*dY-0.00738*dX+0.0053*dX**4-0.00039*dX*dX*dY**3+0.00033*dX**4*dY-0.00012*dX*dY;
 const e=5260.52916*dX+105.94684*dX*dY+2.45656*dX*dY*dY-0.81885*dX**3+0.05594*dX*dY**3-0.05607*dX**3*dY+0.01199*dY-0.00256*dX**3*dY*dY+0.00128*dX*dY**4+0.00022*dY*dY-0.00022*dX*dX+0.00026*dX**5;
 return[52.1551744+n/3600,5.38720621+e/3600]}
function randen(ring){const k=111320*Math.cos(ring[0][0]*Math.PI/180),ky=110540;const p=ring.map(([a,o])=>[o*k,a*ky]);
 let A=0;for(let i=0;i<p.length-1;i++)A+=p[i][0]*p[i+1][1]-p[i+1][0]*p[i][1];const ccw=A>0;const out=[];
 for(let i=0;i<p.length-1;i++){const dx=p[i+1][0]-p[i][0],dy=p[i+1][1]-p[i][1];const L=Math.hypot(dx,dy);if(L<0.3)continue;
  const nx=ccw?dy:-dy,ny=ccw?-dx:dx;const az=(Math.atan2(nx,ny)*180/Math.PI+360)%360;out.push({a:ring[i],b:ring[i+1],az,L})}return out}
function inPoly(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];if(((yi>pt[1])!=(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))c=!c}return c}
function zetOrient(az){const o={voorAz:Math.round(az)};o.voor=sector(az);o.achter=sector(az+180);o.zijA=sector(az+90);o.zijB=sector(az+270);cur.orient=o;save()}
function orientOpties(){const o=cur.orient;const l=[];if(o){l.push(['Voorgevel '+o.voor,o.voor],['Achtergevel '+o.achter,o.achter],['Zijgevel '+o.zijA,o.zijA],['Zijgevel '+o.zijB,o.zijB])}
 SECT.forEach(s=>l.push([s,s]));l.push(['Horizontaal','H']);return l}

// ---------- BAG / 3D BAG ----------
const LS='https://api.pdok.nl/bzk/locatieserver/search/v3_1/';
async function haalJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('server gaf '+r.status);return r.json()}
async function suggestAdres(q){const j=await haalJSON(LS+'suggest?fq=type:adres&rows=8&q='+encodeURIComponent(q));return j.response.docs}
async function lookupAdres(id){const j=await haalJSON(LS+'lookup?fl=*&id='+encodeURIComponent(id));return j.response.docs[0]}
const GEEN_NET='Geen verbinding met de BAG-diensten. Open de app in Safari of Chrome (niet in de voorbeeldweergave van de chat) en controleer je internet.';
async function haalGegevens(doc){
 cur.adres={naam:doc.weergavenaam,straat:doc.straatnaam,huisnummer:doc.huisnummer,toevoeging:(doc.huisletter||'')+(doc.huisnummertoevoeging||''),postcode:doc.postcode,plaats:doc.woonplaatsnaam,vboId:doc.adresseerbaarobject_id};
 const m=/POINT\(([\d.]+) ([\d.]+)\)/.exec(doc.centroide_rd||'');if(!m)throw new Error('geen coördinaten');const x=+m[1],y=+m[2];
 const base='https://service.pdok.nl/lv/bag/wfs/v2_0?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:28992&bbox='+[x-1,y-1,x+1,y+1].join(',')+',EPSG:28992&typeNames=';
 const [vr,pr]=await Promise.all([fetch(base+'bag:verblijfsobject').then(r=>r.json()),fetch(base+'bag:pand').then(r=>r.json())]);
 const vbo=(vr.features||[]).find(f=>String(f.properties.identificatie)===String(doc.adresseerbaarobject_id))||(vr.features||[])[0];
 const vp=vbo?.properties||{};const pids=String(vp.pandidentificatie||'').split(/[,; ]+/);
 const panden=pr.features||[];
 let pand=panden.find(f=>pids.includes(String(f.properties.identificatie)));
 if(!pand)pand=panden.find(f=>{const g=f.geometry;const r=g.type==='Polygon'?g.coordinates[0]:g.coordinates[0][0];return inPoly([x,y],r)})||panden[0];
 const pp=pand?.properties||{};
 cur.bag={bouwjaar:pp.bouwjaar??vp.bouwjaar,oppervlakte:vp.oppervlakte,gebruiksdoel:vp.gebruiksdoel,status:pp.status??vp.status,pandId:pp.identificatie,vboId:vp.identificatie,aantalVbo:pp.aantal_verblijfsobjecten};
 if(pand){const g=pand.geometry;const r=g.type==='Polygon'?g.coordinates[0]:g.coordinates[0][0];cur.ring=r.map(([a,b])=>rd2wgs(a,b))}
 cur.hoogte=null;
 if(pp.identificatie){try{const j=await fetch('https://api.3dbag.nl/collections/pand/items/NL.IMBAG.Pand.'+pp.identificatie).then(r=>r.json());
  const objs=j.feature?.CityObjects||{};let at=null;for(const k in objs){if(objs[k].attributes&&Object.keys(objs[k].attributes).some(a=>/maaiveld/.test(a))){at=objs[k].attributes;break}}
  if(at){const mx=at.b3_h_dak_max??at.h_dak_max??at.b3_h_max;const mv=at.b3_h_maaiveld??at.h_maaiveld;if(mx!=null&&mv!=null)cur.hoogte={max:+mx,maaiveld:+mv,h:+(mx-mv).toFixed(2)}}}catch(e){}}
 save()}

// ---------- schermen ----------
const STAPPEN=[['adres','Adres'],['kaart','Voorgevel'],['type','Gebouw'],['opname','Opname'],['export','Export']];
function render(){
 $('#steps').innerHTML=scherm==='lijst'?'':STAPPEN.map(([k,l])=>`<span data-go="${k}" class="${k===scherm?'on':''}">${l}</span>`).join('');
 $('#titel').textContent=cur?.adres?.naam||'Opname Energielabel';
 if(map){map.remove();map=null}
 ({lijst,adres,kaart,type,opname,export:exp})[scherm]();
 if(vorig!==scherm+vIdx)window.scrollTo(0,0);vorig=scherm+vIdx}
function bar(h){$('#bar').innerHTML=h}

function lijst(){
 $('#app').innerHTML=`<h2>Opnames</h2>${store.opnames.length?'':'<p class="note">Nog geen opnames. Start hieronder een nieuwe.</p>'}`+
 store.opnames.slice().reverse().map(o=>`<div class="card"><div class="ihead"><span>${esc(o.adres?.naam||'Zonder adres')}</span></div>
 <div class="note">${new Date(o.datum).toLocaleString('nl-NL')}</div><div class="row" style="margin-top:10px"><button class="small" data-open="${o.id}">Openen</button><button class="small del" data-wis="${o.id}">Verwijderen</button></div></div>`).join('');
 bar(`<button data-act="nieuw">+ Nieuwe opname</button>`)}

function adres(){
 const b=cur.bag;
 $('#app').innerHTML=`<div class="card"><h2>Adres</h2><label>Postcode + huisnummer of straat, nummer, plaats</label>
 <input id="q" placeholder="Begin te typen, bijv. 2941 BA 11" value="${esc(cur.adres?.naam||'')}" autocomplete="off" enterkeyhint="search">
 <p class="note">Tip: tik op de microfoon van je toetsenbord om het adres in te spreken.</p><div id="res"></div></div>
 ${b?`<div class="card"><h3>BAG-gegevens</h3><div class="kv">
 <b>Bouwjaar</b><span>${esc(b.bouwjaar??'–')}</span><b>Gebruiksoppervlakte</b><span>${b.oppervlakte!=null?esc(b.oppervlakte)+' m²':'–'}</span>
 <b>Gebruiksdoel</b><span>${esc(b.gebruiksdoel??'–')}</span><b>Status</b><span>${esc(b.status??'–')}</span>
 <b>Verblijfsobjecten in pand</b><span>${esc(b.aantalVbo??'–')}</span><b>Pand-ID</b><span>${esc(b.pandId??'–')}</span>
 <b>Hoogste punt (3D BAG)</b><span>${cur.hoogte?f2(cur.hoogte.h)+' m boven maaiveld':'niet gevonden'}</span></div></div>`:''}`;
 bar(`<button class="ghost" data-act="lijst">Opnames</button><button data-go="kaart" ${b?'':'disabled'}>Verder</button>`);
 let tm;$('#q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(doeZoek,250)});$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(tm);doeZoek()}})}
let zoekNr=0;
async function doeZoek(){const q=$('#q').value.trim();if(q.length<3){$('#res').innerHTML='';return}const nr=++zoekNr;
 try{const r=await suggestAdres(q);if(nr!==zoekNr)return;zoekRes=r;
  $('#res').innerHTML=r.length?'<div class="sug">'+r.map((d,i)=>`<div class="res" data-kies="${i}">${esc(d.weergavenaam)}</div>`).join('')+'</div>':'<p class="note">Geen adres gevonden.</p>'}
 catch(e){if(nr===zoekNr)$('#res').innerHTML='<p class="err">'+GEEN_NET+'</p>'}}

function kaart(){
 const o=cur.orient;
 $('#app').innerHTML=`<div class="card"><h2>Voorgevel aantikken</h2><p class="note">Tik op de gevellijn van de voorgevel. De oriëntatie van alle gevels wordt daarna berekend.</p>
 ${cur.ring?'<div id="map"></div>':'<p class="note">Geen pandomtrek gevonden. Kies de oriëntatie van de voorgevel hieronder.</p>'}
 <div id="or" style="margin-top:10px">${o?orientHTML(o):''}</div>
 <label>Of kies handmatig de oriëntatie van de voorgevel</label><select id="handOr"><option value="">–</option>${SECT.map((s,i)=>`<option value="${i*45}">${s}</option>`).join('')}</select></div>`;
 bar(`<button class="ghost" data-go="adres">Terug</button><button data-go="type" ${o?'':'disabled'} id="verder">Verder</button>`);
 $('#handOr').onchange=e=>{if(e.target.value!==''){zetOrient(+e.target.value);kaart()}};
 if(!cur.ring)return;
 map=L.map('map',{zoomControl:true});
 const lucht=L.tileLayer('https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:3857/{z}/{x}/{y}.jpeg',{maxZoom:22,maxNativeZoom:19,attribution:'PDOK luchtfoto'});
 const brt=L.tileLayer('https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19,attribution:'PDOK BRT'});
 lucht.addTo(map);L.control.layers({'Luchtfoto':lucht,'Kaart':brt}).addTo(map);
 const lijnen=[];
 randen(cur.ring).forEach(r=>{const pl=L.polyline([r.a,r.b],{color:'#ffd23f',weight:12,opacity:.75}).addTo(map);lijnen.push(pl);
  if(o&&Math.round(r.az)===o.voorAz)pl.setStyle({color:'#e63b2e'});
  pl.on('click',()=>{lijnen.forEach(l=>l.setStyle({color:'#ffd23f'}));pl.setStyle({color:'#e63b2e'});zetOrient(r.az);$('#or').innerHTML=orientHTML(cur.orient);$('#verder').disabled=false})});
 map.fitBounds(L.polyline(cur.ring).getBounds(),{padding:[30,30],maxZoom:20})}
const orientHTML=o=>`<span class="pill">Voorgevel ${o.voor} (${o.voorAz}°)</span><span class="pill">Achtergevel ${o.achter}</span><span class="pill">Zijgevel ${o.zijA}</span><span class="pill">Zijgevel ${o.zijB}</span>`;

function type(){
 const t=norm(cur.type||(cur.type={}));save();
 const namen=verdNamen(t);if(t.start==null||t.start>=namen.length)t.start=namen.length-1;
 const ch=(k,v,l)=>`<button class="${t[k]===v?'on':''}" data-set="${k}" data-v="${v}">${l}</button>`;
 const ex=extraMaat();const corrNote=`<p class="note">${ex?`Bij maten tussen bouwmuren wordt gevraagd of er ${ex>0.2?'2 × 11 cm = 22 cm':'11 cm'} bij moet.`:'Geen bouwmuurcorrectie.'}</p>`;
 const gd=cur.bag?.gebruiksdoel?`<p class="note">BAG-gebruiksdoel: ${esc(cur.bag.gebruiksdoel)}</p>`:'';
 let deel='';
 if(t.methode==='W'){deel=`<div class="card"><h3>Woningtype</h3><div class="choice">${ch('wtype','vrijstaand','Vrijstaand')}${ch('wtype','2onder1','2-onder-1-kap')}${ch('wtype','tussen','Rijwoning tussen')}${ch('wtype','hoek','Rijwoning hoek')}${ch('wtype','appartement','Appartement')}</div>
  ${t.wtype==='appartement'?`<label>Type gebouw</label><div class="choice">${ch('atype','galerij','Galerij')}${ch('atype','portiek','Portiek')}${ch('atype','flat','Flat / overig')}${ch('atype','maisonnette','Maisonnette')}</div>
  <label>Ligging in gebouw</label><div class="choice">${ch('alaag','grond','Op de grond')}${ch('alaag','tussen','Tussenlaag')}${ch('alaag','dak','Onder dak')}${ch('alaag','grond+dak','Grond + dak')}</div>
  <label>Positie</label><div class="choice">${ch('apos','tussen','Tussen')}${ch('apos','hoek','Hoek / kop')}</div>`:''}${corrNote}</div>`}
 else{deel=`<div class="card"><h3>Gebruiksfuncties</h3>${t.functies.map((x,i)=>`<div class="row" style="margin-bottom:8px"><select data-fi="${i}" style="flex:2">${UFUNC.map(u=>`<option ${u===x.f?'selected':''}>${u}</option>`).join('')}</select>
  <input data-fm="${i}" inputmode="decimal" placeholder="m² GO" value="${esc(x.m2)}" style="flex:1"><button class="small del" style="flex:0 0 auto" data-fdel="${i}">✕</button></div>`).join('')}
  <button class="small ghost" data-act="fadd">+ Gebruiksfunctie</button>
  <label>Belending</label><div class="choice">${ch('belend','geen','Vrijstaand')}${ch('belend','een','Eén zijde belend')}${ch('belend','twee','Twee zijden belend')}</div>${corrNote}</div>`}
 $('#app').innerHTML=`<div class="card"><h2>Methode</h2><div class="choice">${ch('methode','W','EP-W · woning<br><small>ISSO 82.1</small>')}${ch('methode','U','EP-U · utiliteit<br><small>ISSO 75.1</small>')}</div>${gd}</div>${deel}
 <div class="card"><h3>Bouwlagen</h3><div class="grid2"><div><label>Aantal bouwlagen (excl. zolder)</label><input type="number" inputmode="numeric" min="1" max="40" id="lagen" value="${t.lagen}"></div>
 <div><label>${t.methode==='W'?'Zolder':'Dakopbouw / zolder'}</label><select id="zolder"><option value="1" ${t.zolder?'selected':''}>Ja</option><option value="0" ${t.zolder?'':'selected'}>Nee</option></select></div></div>
 <label>Beginnen op</label><select id="start">${namen.map((n,i)=>`<option value="${i}" ${i===t.start?'selected':''}>${n}</option>`).join('')}</select></div>`;
 bar(`<button class="ghost" data-go="kaart">Terug</button><button data-act="start">Start opname</button>`);
 $('#lagen').onchange=e=>{t.lagen=Math.max(1,+e.target.value||1);t.start=null;save();type()};
 $('#zolder').onchange=e=>{t.zolder=e.target.value==='1';t.start=null;save();type()};
 $('#start').onchange=e=>{t.start=+e.target.value;save()};
 document.querySelectorAll('[data-fi]').forEach(el=>el.onchange=e=>{t.functies[+el.dataset.fi].f=el.value;save()});
 document.querySelectorAll('[data-fm]').forEach(el=>el.onchange=e=>{t.functies[+el.dataset.fm].m2=el.value;save()})}
function verdNamen(t){const n=['Begane grond'];for(let i=1;i<t.lagen;i++)n.push(i+'e verdieping');if(t.zolder)n.push('Zolder');return n}
function startOpname(){const namen=verdNamen(cur.type);const oud=cur.verdiepingen||[];
 cur.verdiepingen=namen.map(n=>oud.find(v=>v.naam===n)||{naam:n,items:[]});vIdx=cur.type.start??namen.length-1;save();scherm='opname';render()}

function opname(){
 if(!cur.verdiepingen){startOpname();return}
 const vs=cur.verdiepingen;const v=vs[vIdx];const mt=cur.type?.methode==='U'?'EP-U · ISSO 75.1':'EP-W · ISSO 82.1';
 $('#app').innerHTML=`<p class="note" style="margin:0 0 8px">${mt}</p><div class="tabs">${vs.map((x,i)=>i).reverse().map(i=>`<button class="${i===vIdx?'on':''}" data-v-idx="${i}">${esc(vs[i].naam)}</button>`).join('')}</div>`+
 SECTIES.map(([type,titel])=>{const its=v.items.filter(i=>i.type===type);
  return `<div class="sec"><div class="sechead"><h3>${titel}</h3><button class="small ghost" data-add="${type}">+ ${DEF[type].t}</button></div>${its.map(itemHTML).join('')||'<p class="note">Nog niets ingevoerd.</p>'}</div>`}).join('');
 bar(`<button class="ghost" data-go="type">Gebouw</button><button data-go="export">Klaar → export</button>`)}
function itemHTML(it){const d=DEF[it.type];const op=opp(it);let netto='';
 if(op!=null&&it.subs?.length){const af=it.subs.reduce((s,x)=>s+(DEF[x.type].opp&&x.type!=='dakkapel'?(opp(x)||0):0),0);if(af)netto=` · netto ${f2(op-af)} m²`}
 return `<div class="item"><div class="ihead"><span>${it.type==='installatie'?esc(it.soort||'Installatie'):d.t}${it.orient?' · '+esc((it.orientL&&it.orientL!==it.orient?it.orientL+' ':'')+it.orient):''}</span><span style="display:flex;gap:6px"><button class="small ghost" data-kopie="${it.id}">Kopieer</button><button class="small del" data-del="${it.id}">✕</button></span></div>
 <div class="grid2">${d.f.filter(f=>zichtbaar(it,f)).map(f=>fieldHTML(it,f)).join('')}</div>${op!=null?`<div class="opp"><b>Totaal ${f2(op)} m²</b>${num(it.m2)!=null?' (direct ingevuld)':DEF[it.type].f.some(f=>f.k==='m2')?' (breedte × hoogte'+(DEF[it.type].opp.includes('aantal')?' × aantal':'')+')':''}${netto}${glasOpp(it)!=null?` · glas ${f2(glasOpp(it))} m² · <b>netto deur ${f2(op-glasOpp(it))} m²</b>`:''}</div>`:''}
 ${d.sub?`<div>${(it.subs||[]).map(itemHTML).join('')}<div class="row" style="margin-top:6px">${d.sub.map(s=>`<button class="small ghost" data-addsub="${it.id}" data-t="${s}">+ ${DEF[s].t}</button>`).join('')}</div></div>`:''}</div>`}
function fieldHTML(it,f){const v=it[f.k]??'';const id=`data-id="${it.id}" data-k="${f.k}"`;let inp;
 if(f.t==='num')inp=`<input inputmode="decimal" ${id} value="${esc(v)}">`;
 else if(f.t==='sel')inp=`<select ${id}>${opts(f).map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(f.t==='orient')inp=`<select ${id}><option value="">–</option>${orientOpties().map(([l,o])=>`<option value="${o}" ${o===v&&l.startsWith(it.orientL||l)?'selected':''}>${l}</option>`).join('')}</select>`;
 else inp=`<input ${id} value="${esc(v)}">`;
 let c='';if(f.corr&&num(v)!=null&&extraMaat()){c=`<div class="corr">${it[f.k+'_x']?`+${Math.round(it[f.k+'_x']*100)} cm → ${f2(val(it,f.k))} m`:'Zonder correctie'} · <a href="#" data-corr="${it.id}" data-k="${f.k}">wijzig</a></div>`}
 const wide=f.t==='txt'||f.corr||f.t==='orient';
 return `<div style="${wide?'grid-column:1/-1':''}"><label>${f.l}</label>${inp}${c}</div>`}
async function vraagCorr(it,k){const ex=extraMaat();const m=num(it[k]);if(!ex||m==null){it[k+'_x']=0;return}
 const tekst=ligLabel();
 it[k+'_x']=(await vraag(`${tekst}: ${Math.round(ex*100)} cm erbij tellen?\n\n${f2(m)} m → ${f2(m+ex)} m`,'Ja, erbij','Nee'))?ex:0}

function exp(){
 const n=(cur.verdiepingen||[]).reduce((s,v)=>s+v.items.length,0);
 $('#app').innerHTML=`<div class="card"><h2>Export</h2><div class="kv"><b>Adres</b><span>${esc(cur.adres?.naam||'–')}</span><b>Bouwjaar</b><span>${esc(cur.bag?.bouwjaar??'–')}</span>
 <b>Methode</b><span>${cur.type?.methode==='U'?'EP-U (ISSO 75.1)':'EP-W (ISSO 82.1)'}</span><b>Voorgevel</b><span>${cur.orient?cur.orient.voor:'–'}</span><b>Onderdelen</b><span>${n}</span></div>
 <p class="note" style="margin-top:12px">Dit is een voorlopige XML-structuur. Zodra je een voorbeeld-XML uit Vabi hebt, wordt de export daar precies op afgestemd.</p>
 <div class="row" style="margin-top:8px"><button data-act="download">Download XML</button>${navigator.share?'<button class="ghost" data-act="deel">Delen</button>':''}</div></div>
 <details class="card"><summary>Voorbeeld XML</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(maakXML())}</pre></details>`;
 bar(`<button class="ghost" data-go="opname">Terug</button><button class="ghost" data-act="lijst">Alle opnames</button>`)}
function maakXML(){const a=o=>Object.entries(o).filter(([,v])=>v!=null&&v!=='').map(([k,v])=>` ${k}="${esc(v)}"`).join('');
 const el=(it,ind)=>{const d=DEF[it.type];const at={};d.f.filter(f=>zichtbaar(it,f)).forEach(f=>{const v=it[f.k];if(v==null||v==='')return;
   if(f.t==='num'){at[f.k]=num(v);if(f.corr){at[f.k+'_gemeten']=num(v);at[f.k]=+val(it,f.k).toFixed(3);at[f.k+'_correctie']=it[f.k+'_x']||0}}else at[f.k]=v});
  const o=opp(it);if(o!=null)at.oppervlakte=+o.toFixed(2);const go=glasOpp(it);if(go!=null){at.glasOppervlakte=+go.toFixed(2);if(o!=null)at.nettoDeur=+(o-go).toFixed(2)}const tag=d.t.replace(/[^A-Za-z]/g,'');const subs=it.subs||[];
  return subs.length?`${ind}<${tag}${a(at)}>\n${subs.map(s=>el(s,ind+'  ')).join('\n')}\n${ind}</${tag}>`:`${ind}<${tag}${a(at)}/>`};
 const t=cur.type||{},b=cur.bag||{},o=cur.orient||{},h=cur.hoogte||{};
 return `<?xml version="1.0" encoding="UTF-8"?>\n<Opname versie="0.1" datum="${new Date().toISOString()}" methode="${cur.type?.methode==='U'?'ISSO 75.1':'ISSO 82.1'}">\n`+
 `  <Adres${a({postcode:cur.adres?.postcode,huisnummer:cur.adres?.huisnummer,toevoeging:cur.adres?.toevoeging,straat:cur.adres?.straat,plaats:cur.adres?.plaats})}/>\n`+
 `  <BAG${a({bouwjaar:b.bouwjaar,gebruiksoppervlakte:b.oppervlakte,gebruiksdoel:b.gebruiksdoel,pandId:b.pandId,verblijfsobjectId:b.vboId})}/>\n`+
 `  <Gebouw${a({hoogsteVanafMaaiveld:h.h,dakMaxNAP:h.max,maaiveldNAP:h.maaiveld})}/>\n`+
 `  <Orientatie${a({voorgevelAzimut:o.voorAz,voorgevel:o.voor,achtergevel:o.achter,zijgevelA:o.zijA,zijgevelB:o.zijB})}/>\n`+
 (t.methode==='U'?`  <Utiliteit${a({belending:t.belend,bouwlagen:t.lagen,dakopbouw:t.zolder?'ja':'nee'})}>\n${(t.functies||[]).map(x=>`    <Gebruiksfunctie${a({functie:x.f,gebruiksoppervlakte:num(x.m2)})}/>`).join('\n')}\n  </Utiliteit>\n`
 :`  <Woning${a({woningtype:t.wtype,gebouwtype:t.wtype==='appartement'?t.atype:null,ligging:t.wtype==='appartement'?t.alaag:null,positie:t.wtype==='appartement'?t.apos:null,bouwlagen:t.lagen,zolder:t.zolder?'ja':'nee'})}/>\n`)+`  <Verdiepingen>\n`+
 (cur.verdiepingen||[]).map(v=>`    <Verdieping naam="${esc(v.naam)}">\n${v.items.map(i=>el(i,'      ')).join('\n')}\n    </Verdieping>`).join('\n')+`\n  </Verdiepingen>\n</Opname>\n`}
function xmlBestand(){const naam='opname_'+(cur.adres?.postcode||'')+'_'+(cur.adres?.huisnummer||'')+(cur.adres?.toevoeging||'')+'.xml';return new File([maakXML()],naam.replace(/\s/g,''),{type:'application/xml'})}

function kloon(it){const c=JSON.parse(JSON.stringify(it));const her=x=>{x.id=uid();(x.subs||[]).forEach(her)};her(c);return c}
function nieuwItem(type){const it={id:uid(),type,subs:[]};DEF[type].f.forEach(f=>{if(f.t==='sel'&&f.k!=='isolatie'&&f.k!=='bewijs')it[f.k]=opts(f)[0]});return it}
// ---------- events ----------
document.addEventListener('click',async e=>{const t=e.target.closest('[data-kopie],[data-fdel],[data-go],[data-act],[data-open],[data-wis],[data-kies],[data-v-idx],[data-add],[data-addsub],[data-del],[data-corr],[data-set]');if(!t)return;const d=t.dataset;
 if(d.go){if(!cur)return;scherm=d.go;render()}
 else if(d.act==='nieuw'){cur={id:uid(),datum:Date.now()};store.opnames.push(cur);zoekRes=[];save();scherm='adres';render()}
 else if(d.act==='lijst'){cur=null;scherm='lijst';render()}
  else if(d.act==='start')startOpname();
 else if(d.act==='download'){const f=xmlBestand();const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
 else if(d.act==='deel'){const f=xmlBestand();try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:f.name});else await navigator.share({title:f.name,text:maakXML()})}catch(err){}}
 else if(d.open){cur=store.opnames.find(o=>o.id===d.open);zoekRes=[];scherm=cur.verdiepingen?'opname':'adres';vIdx=cur.type?.start??0;render()}
 else if(d.wis){if(await vraag('Deze opname verwijderen?','Verwijderen','Annuleren')){store.opnames=store.opnames.filter(o=>o.id!==d.wis);save();render()}}
 else if(d.kies!=null){const s0=zoekRes[+d.kies];$('#q').value=s0.weergavenaam;$('#res').innerHTML='<p class="note">Gegevens ophalen uit BAG en 3D BAG…</p>';
  try{const doc=await lookupAdres(s0.id);await haalGegevens(doc);zoekRes=[];render()}catch(err){$('#res').innerHTML='<p class="err">Ophalen mislukt ('+esc(err.message)+'). '+GEEN_NET+'</p>'}}
 else if(d.vIdx!=null){vIdx=+d.vIdx;render()}
 else if(d.add){const it=nieuwItem(d.add);if(d.add==='dakvlak'&&cur.orient)it.orient='';cur.verdiepingen[vIdx].items.push(it);save();render()}
 else if(d.addsub){const r=vind(d.addsub);r.it.subs=r.it.subs||[];r.it.subs.push(nieuwItem(d.t));save();render()}
 else if(d.kopie){const r=vind(d.kopie);r.lijst.splice(r.lijst.indexOf(r.it)+1,0,kloon(r.it));save();render();toast('Gekopieerd, de kopie staat eronder')}
 else if(d.del){if(await vraag('Dit onderdeel verwijderen?','Verwijderen','Annuleren')){const r=vind(d.del);r.lijst.splice(r.lijst.indexOf(r.it),1);save();render()}}
 else if(d.corr){e.preventDefault();const r=vind(d.corr);await vraagCorr(r.it,d.k);save();render()}
 else if(d.set){cur.type[d.set]=d.v;save();type()}
 else if(d.act==='fadd'){cur.type.functies.push({f:'Kantoorfunctie',m2:''});save();type()}
