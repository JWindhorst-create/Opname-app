name: Bronnen controleren
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/bronnen.mjs'
      - '.github/workflows/bronnen.yml'
permissions:
  contents: write
concurrency:
  group: bronnen
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/bronnen.mjs
      - name: Opslaan
        run: |
          git config user.name "bronnen-controle"
          git config user.email "bronnen-controle@users.noreply.github.com"
          git add bronnen.json
          git diff --cached --quiet && exit 0
          git commit -m "Bronnen bijgewerkt"
          git pull --rebase origin main
          git push
